<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ShakibYS</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f5f6fa;
  color:#202124;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.topbar{
  height:62px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 14px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:23px;
  font-weight:900;
  color:#ff2f92;
  margin-right:auto;
}

.top-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ffe1ef;
  color:#ff2f92;
  font-size:20px;
}

.top-btn:hover{
  background:#ff2f92;
  color:#fff;
}

.app{
  max-width:1200px;
  margin:auto;
  padding:14px;
}

.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:14px;
}

.nav button{
  flex:0 0 auto;
  padding:11px 16px;
  border-radius:25px;
  background:#fff;
  color:#555;
  box-shadow:0 2px 8px #0000000d;
}

.nav button.active,
.nav button:hover{
  background:#ff2f92;
  color:white;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 12px #0000000a;
}

.hidden{
  display:none!important;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  background:linear-gradient(135deg,#ff2f92,#8b5cf6);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:bold;
  font-size:23px;
}

.avatar.big{
  width:90px;
  height:90px;
  font-size:32px;
}

.name{
  font-weight:800;
  font-size:17px;
}

.muted{
  color:#777;
  font-size:13px;
}

.search{
  width:100%;
  padding:13px 16px;
  border:1px solid #eee;
  border-radius:25px;
  outline:none;
  background:#f7f7f8;
}

.search:focus{
  border-color:#ff2f92;
}

.create-row{
  display:flex;
  gap:10px;
  align-items:center;
}

textarea{
  width:100%;
  min-height:75px;
  border:0;
  outline:0;
  resize:none;
  background:#f7f7f8;
  padding:13px;
  border-radius:14px;
}

.primary{
  background:#ff2f92;
  color:#fff;
  padding:11px 18px;
  border-radius:24px;
  font-weight:bold;
}

.secondary{
  background:#ffe1ef;
  color:#ff2f92;
  padding:10px 15px;
  border-radius:22px;
  font-weight:bold;
}

.danger{
  background:#ffe5e5;
  color:#e11;
  padding:9px 14px;
  border-radius:20px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-content{
  padding:14px 0;
  line-height:1.55;
  white-space:pre-wrap;
}

.post-media{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:14px;
  margin-top:8px;
}

.post-actions{
  display:flex;
  justify-content:space-around;
  border-top:1px solid #eee;
  padding-top:9px;
  margin-top:8px;
}

.post-actions button{
  background:none;
  color:#555;
  padding:8px 12px;
  border-radius:20px;
}

.post-actions button:hover{
  background:#ffe1ef;
  color:#ff2f92;
}

.user-result{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 5px;
  border-bottom:1px solid #eee;
}

.user-result:last-child{
  border-bottom:0;
}

.user-info{
  flex:1;
}

.online-dot{
  width:10px;
  height:10px;
  background:#21c76b;
  border-radius:50%;
  display:inline-block;
  margin-left:5px;
}

.profile-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.stats{
  display:flex;
  gap:25px;
  margin-top:12px;
}

.stat{
  text-align:center;
}

.stat b{
  display:block;
  font-size:18px;
}

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#fff0f7,#f3eaff);
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:28px 22px;
  border-radius:25px;
  box-shadow:0 10px 35px #00000015;
}

.login-logo{
  text-align:center;
  color:#ff2f92;
  font-size:34px;
  font-weight:900;
  margin-bottom:7px;
}

.login-sub{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.field{
  margin-bottom:13px;
}

.field input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:13px;
  outline:none;
}

.field input:focus{
  border-color:#ff2f92;
}

.full{
  width:100%;
}

.switch{
  text-align:center;
  margin-top:17px;
  color:#777;
}

.switch span{
  color:#ff2f92;
  font-weight:bold;
  cursor:pointer;
}

.chat-layout{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:12px;
  min-height:650px;
}

.chat-list{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
}

.chat-user{
  padding:13px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.chat-user:hover{
  background:#fff0f7;
}

.chat-window{
  background:#fff;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  min-height:650px;
}

.chat-header{
  padding:13px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-header .user-info{
  flex:1;
}

.messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
  min-height:450px;
}

.msg{
  max-width:78%;
  padding:10px 13px;
  margin:6px 0;
  border-radius:16px;
  background:#f0f0f2;
  width:max-content;
}

.msg.me{
  margin-left:auto;
  background:#ff2f92;
  color:#fff;
}

.msg-time{
  display:block;
  font-size:10px;
  opacity:.65;
  margin-top:4px;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #eee;
}

.chat-input input{
  flex:1;
  border:0;
  background:#f5f5f7;
  border-radius:25px;
  padding:12px 15px;
  outline:none;
}

.call-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#ffe1ef;
  color:#ff2f92;
}

.notification{
  padding:13px;
  border-bottom:1px solid #eee;
  display:flex;
  gap:10px;
  align-items:center;
}

.call-modal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.call-box{
  width:100%;
  max-width:600px;
  background:#151515;
  border-radius:22px;
  padding:15px;
  color:#fff;
  text-align:center;
}

.video-area{
  position:relative;
  background:#000;
  border-radius:16px;
  overflow:hidden;
  min-height:350px;
}

#remoteVideo{
  width:100%;
  height:350px;
  object-fit:cover;
}

#localVideo{
  position:absolute;
  right:12px;
  bottom:12px;
  width:130px;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid #fff;
  background:#222;
}

.call-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:15px;
}

.call-buttons button{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#333;
  color:#fff;
  font-size:20px;
}

.call-buttons .end{
  background:#e53935;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:25px;
  z-index:2000;
  display:none;
}

@media(max-width:700px){
  .chat-layout{
    grid-template-columns:1fr;
  }

  .chat-list{
    max-height:260px;
    overflow-y:auto;
  }

  .chat-window{
    min-height:570px;
  }

  .messages{
    min-height:350px;
  }

  .topbar{
    padding:8px;
  }

  .logo{
    font-size:20px;
  }
}
</style>
</head>

<body>

<!-- ======================================================
     LOGIN / REGISTER
====================================================== -->

<section id="loginPage">

  <div class="login-box">

    <div class="login-logo">ShakibYS</div>
    <div class="login-sub">Connect • Message • Call • Share</div>

    <div id="loginForm">

      <div class="field">
        <input
          id="loginPhone"
          type="tel"
          inputmode="numeric"
          placeholder="মোবাইল নাম্বার"
        >
      </div>

      <button class="primary full" onclick="login()">
        লগইন
      </button>

      <div class="switch">
        নতুন ইউজার?
        <span onclick="showRegister()">অ্যাকাউন্ট খুলুন</span>
      </div>

    </div>

    <div id="registerForm" class="hidden">

      <div class="field">
        <input
          id="registerName"
          placeholder="আপনার নাম"
        >
      </div>

      <div class="field">
        <input
          id="registerPhone"
          type="tel"
          inputmode="numeric"
          placeholder="মোবাইল নাম্বার"
        >
      </div>

      <button class="primary full" onclick="register()">
        রেজিস্টার
      </button>

      <div class="switch">
        আগে থেকেই অ্যাকাউন্ট আছে?
        <span onclick="showLogin()">লগইন</span>
      </div>

    </div>

  </div>

</section>

<!-- ======================================================
     MAIN APP
====================================================== -->

<section id="appPage" class="hidden">

  <header class="topbar">

    <div class="logo">ShakibYS</div>

    <button class="top-btn" onclick="openHome()">⌂</button>

    <button class="top-btn" onclick="openMessages()">💬</button>

    <button class="top-btn" onclick="openNotifications()">🔔</button>

    <button class="top-btn" onclick="openMyProfile()">👤</button>

    <button class="top-btn" onclick="logout()">↪</button>

  </header>

  <main class="app">

    <nav class="nav">

      <button id="navHome" class="active" onclick="openHome()">
        🏠 হোম
      </button>

      <button onclick="openSearch()">
        🔎 খুঁজুন
      </button>

      <button onclick="openMessages()">
        💬 মেসেঞ্জার
      </button>

      <button onclick="openNotifications()">
        🔔 নোটিফিকেশন
      </button>

      <button onclick="openMyProfile()">
        👤 প্রোফাইল
      </button>

    </nav>

    <!-- HOME -->

    <section id="homePage">

      <div class="card">
        <div class="create-row">
          <div id="myMiniAvatar" class="avatar"></div>

          <textarea
            id="postText"
            placeholder="আপনার মনে কী আছে?"
          ></textarea>
        </div>

        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">

          <button class="secondary" onclick="createPost('text')">
            📝 পোস্ট
          </button>

          <button class="secondary" onclick="addImagePost()">
            🖼️ ছবি
          </button>

          <button class="secondary" onclick="addVideoPost()">
            🎥 ভিডিও
          </button>

        </div>

      </div>

      <div id="feed"></div>

    </section>

    <!-- SEARCH -->

    <section id="searchPage" class="hidden">

      <div class="card">

        <input
          id="searchInput"
          class="search"
          placeholder="নাম বা মোবাইল নাম্বার দিয়ে খুঁজুন..."
          oninput="searchUsers()"
        >

      </div>

      <div id="searchResults" class="card"></div>

    </section>

    <!-- PROFILE -->

    <section id="profilePage" class="hidden">

      <div id="profileContent"></div>

    </section>

    <!-- MESSAGES -->

    <section id="messagePage" class="hidden">

      <div class="chat-layout">

        <div class="chat-list">

          <div style="padding:13px;font-weight:bold">
            💬 মেসেজ
          </div>

          <input
            id="chatSearch"
            class="search"
            style="margin:0 10px 10px;width:calc(100% - 20px)"
            placeholder="ইউজার খুঁজুন..."
            oninput="searchChatUsers()"
          >

          <div id="chatUsers"></div>

        </div>

        <div class="chat-window">

          <div id="chatHeader" class="chat-header">

            <div class="muted">
              একজন ইউজার নির্বাচন করুন
            </div>

          </div>

          <div id="messages" class="messages">

            <div class="muted" style="text-align:center">
              মেসেজ শুরু করতে একজন ইউজার নির্বাচন করুন।
            </div>

          </div>

          <div id="typingText"
               class="muted"
               style="padding:0 15px">
          </div>

          <div class="chat-input">

            <input
              id="messageInput"
              placeholder="মেসেজ লিখুন..."
              oninput="typingStart()"
              onkeydown="if(event.key==='Enter')sendMessage()"
            >

            <button
              class="primary"
              onclick="sendMessage()">
              ➤
            </button>

          </div>

        </div>

      </div>

    </section>

    <!-- NOTIFICATIONS -->

    <section id="notificationPage" class="hidden">

      <div class="card">

        <h3 style="margin-bottom:10px">
          🔔 নোটিফিকেশন
        </h3>

        <div id="notifications"></div>

      </div>

    </section>

  </main>

</section>

<!-- ======================================================
     CALL MODAL
====================================================== -->

<div id="callModal" class="call-modal hidden">

  <div class="call-box">

    <h3 id="callTitle">
      📞 কল
    </h3>

    <p id="callStatus" style="margin:8px 0 15px">
      Connecting...
    </p>

    <div class="video-area">

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

    </div>

    <div class="call-buttons">

      <button onclick="toggleMute()">
        🎙️
      </button>

      <button onclick="toggleCamera()">
        📷
      </button>

      <button class="end" onclick="endCall()">
        ☎
      </button>

    </div>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

/* ======================================================
   GLOBAL
====================================================== */

const socket = io();

let currentUser =
  JSON.parse(localStorage.getItem("shakibys_user") || "null");

let selectedUser = null;

let currentProfileUser = null;

let posts = [];

let usersCache = [];

let notifications = [];

let peer = null;

let localStream = null;

let currentCallUser = null;

let currentCallType = "video";

let typingTimer = null;


/* ======================================================
   INIT
====================================================== */

document.addEventListener("DOMContentLoaded", () => {

  if(currentUser){

    showApp();

    socket.emit("user:online",{
      userId:currentUser.id,
      name:currentUser.name,
      phone:currentUser.phone
    });

    loadFeed();

  }else{

    showLogin();

  }

});


/* ======================================================
   UI
====================================================== */

function $(id){
  return document.getElementById(id);
}

function toast(message){

  const t = $("toast");

  t.textContent = message;

  t.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    t.style.display = "none";
  },2500);
}

function showLogin(){

  $("loginPage").classList.remove("hidden");

  $("appPage").classList.add("hidden");

  $("loginForm").classList.remove("hidden");

  $("registerForm").classList.add("hidden");
}

function showRegister(){

  $("loginForm").classList.add("hidden");

  $("registerForm").classList.remove("hidden");
}

function showApp(){

  $("loginPage").classList.add("hidden");

  $("appPage").classList.remove("hidden");

  updateMyAvatar();

  openHome();
}

function hidePages(){

  $("homePage").classList.add("hidden");

  $("searchPage").classList.add("hidden");

  $("profilePage").classList.add("hidden");

  $("messagePage").classList.add("hidden");

  $("notificationPage").classList.add("hidden");
}

function openHome(){

  hidePages();

  $("homePage").classList.remove("hidden");

  loadFeed();

}

function openSearch(){

  hidePages();

  $("searchPage").classList.remove("hidden");

  $("searchInput").focus();

}

function openMessages(){

  hidePages();

  $("messagePage").classList.remove("hidden");

  loadChatUsers();

}

function openNotifications(){

  hidePages();

  $("notificationPage").classList.remove("hidden");

  loadNotifications();

}

function openMyProfile(){

  if(!currentUser) return;

  openProfile(currentUser.id);

}


/* ======================================================
   AUTH
====================================================== */

async function login(){

  const phone =
    $("loginPhone").value.trim();

  if(!phone){

    toast("মোবাইল নাম্বার দিন");

    return;
  }

  try{

    const res =
      await fetch("/api/auth/login",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({phone})

      });

    const data = await res.json();

    if(!data.success){

      toast(data.message || "লগইন করা যায়নি");

      return;
    }

    currentUser = data.user;

    localStorage.setItem(
      "shakibys_user",
      JSON.stringify(currentUser)
    );

    showApp();

    socket.emit("user:online",{
      userId:currentUser.id,
      name:currentUser.name,
      phone:currentUser.phone
    });

    toast("লগইন সফল হয়েছে");

  }catch(error){

    toast("Server connection error");

  }

}

async function register(){

  const name =
    $("registerName").value.trim();

  const phone =
    $("registerPhone").value.trim();

  if(!name || !phone){

    toast("নাম ও নাম্বার দিন");

    return;
  }

  try{

    const res =
      await fetch("/api/auth/register",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          name,
          phone
        })

      });

    const data = await res.json();

    if(!data.success){

      toast(data.message || "রেজিস্টার করা যায়নি");

      return;
    }

    currentUser = data.user;

    localStorage.setItem(
      "shakibys_user",
      JSON.stringify(currentUser)
    );

    showApp();

    socket.emit("user:online",{
      userId:currentUser.id,
      name:currentUser.name,
      phone:currentUser.phone
    });

    toast("অ্যাকাউন্ট তৈরি হয়েছে");

  }catch(error){

    toast("Server connection error");

  }

}

function logout(){

  localStorage.removeItem("shakibys_user");

  currentUser = null;

  location.reload();

}


/* ======================================================
   AVATAR
====================================================== */

function avatarHTML(user, big=false){

  if(user.avatar){

    return `
      <img
        class="avatar ${big?"big":""}"
        src="${escapeHtml(user.avatar)}"
      >
    `;

  }

  const letter =
    escapeHtml(
      (user.name || "?").charAt(0).toUpperCase()
    );

  return `
    <div class="avatar ${big?"big":""}">
      ${letter}
    </div>
  `;
}

function updateMyAvatar(){

  if(!currentUser) return;

  $("myMiniAvatar").outerHTML =
    avatarHTML(currentUser);

  $("myMiniAvatar").id =
    "myMiniAvatar";

}


/* ======================================================
   SEARCH USERS
====================================================== */

let searchTimer = null;

async function searchUsers(){

  clearTimeout(searchTimer);

  searchTimer = setTimeout(async()=>{

    const q =
      $("searchInput").value.trim();

    try{

      const res =
        await fetch(
          "/api/users?q="+encodeURIComponent(q)
        );

      const data = await res.json();

      usersCache = data.users || [];

      renderSearchUsers(usersCache);

    }catch(error){

      toast("User search error");

    }

  },250);

}

function renderSearchUsers(list){

  const box = $("searchResults");

  if(!list.length){

    box.innerHTML =
      `<div class="muted">কোনো ইউজার পাওয়া যায়নি</div>`;

    return;
  }

  box.innerHTML =
    list.map(user=>`

      <div class="user-result">

        ${avatarHTML(user)}

        <div class="user-info">

function addImagePost(){

  const input =
    document.createElement("input");

  input.type="file";

  input.accept="image/*";

  input.onchange=()=>{

    const file=input.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=async()=>{

      await uploadPostMedia(
        "image",
        reader.result
      );

    };

    reader.readAsDataURL(file);

  };

  input.click();

}

function addVideoPost(){

  const input =
    document.createElement("input");

  input.type="file";

  input.accept="video/*";

  input.onchange=()=>{

    const file=input.files[0];

    if(!file)return;

    reader.onload=async()=>{

      await uploadPostMedia(
        "video",
        reader.result
      );

    };

    reader.readAsDataURL(file);

  };

  input.click();

}

/* ======================================================
   VOICE / VIDEO CALL — WEBRTC
====================================================== */

const rtcConfig = {

  iceServers:[
    {
      urls:"stun:stun.l.google.com:19302"
    },
    {
      urls:"stun:stun1.l.google.com:19302"
    }
  ]

};

async function createPeer(){

  peer =
    new RTCPeerConnection(rtcConfig);

  peer.onicecandidate = event =>{

    if(event.candidate && currentCallUser){

      socket.emit("call:ice",{

        targetUserId:currentCallUser.id,

        candidate:event.candidate

      });

    }

  };

  peer.ontrack = event =>{

    $("remoteVideo").srcObject =
      event.streams[0];

  };

  peer.onconnectionstatechange = ()=>{

    if(
      peer &&
      (
        peer.connectionState==="failed" ||
        peer.connectionState==="disconnected"
      )
    ){

      endCall(false);

    }

  };

}

async function startCall(userId,type){

  try{

    const res =
      await fetch("/api/users/"+userId);

    const data=await res.json();

    if(!data.success){

      toast("User পাওয়া যায়নি");

      return;
    }

    currentCallUser=data.user;

    currentCallType=type;

    $("callModal").classList.remove("hidden");

    $("callTitle").textContent =
      type==="video"
      ?"🎥 Video Call"
      :"📞 Audio Call";

    $("callStatus").textContent =
      currentCallUser.name+
      " কে কল করা হচ্ছে...";

    await createPeer();

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio:true,

        video:type==="video"

      });

    localStream.getTracks().forEach(track=>{

      peer.addTrack(track,localStream);

    });

    $("localVideo").srcObject =
      localStream;

    if(type==="voice"){

      $("localVideo").style.display="none";

    }else{

      $("localVideo").style.display="block";

    }

    const offer =
      await peer.createOffer();

    await peer.setLocalDescription(offer);

    socket.emit("call:offer",{

      receiverId:currentCallUser.id,

      callerId:currentUser.id,

      callerName:currentUser.name,

      callType:type,

      offer

    });

  }catch(error){

    console.error(error);

    toast(
      "Camera/Microphone permission দিন"
    );

    endCall(false);

  }

}


/* INCOMING CALL */

socket.on("call:offer",async data=>{

  const callerId=data.callerId;

  const res =
    await fetch("/api/users/"+callerId);

  const userData=await res.json();

  const caller =
    userData.user ||
    {
      id:callerId,
      name:data.callerName||"Someone"
    };

  const accept =
    confirm(
      (data.callType==="video"?"🎥":"📞")+
      " "+caller.name+
      " আপনাকে কল করছে।\n\nAccept করবেন?"
    );

  if(!accept){

    socket.emit("call:reject",{

      callerId,

      receiverId:currentUser.id

    });

    return;

  }

  currentCallUser=caller;

  currentCallType =
    data.callType || "voice";

  $("callModal").classList.remove("hidden");

  $("callTitle").textContent =
    currentCallType==="video"
    ?"🎥 Video Call"
    :"📞 Audio Call";

  $("callStatus").textContent =
    caller.name+" এর সাথে কল চলছে";

  try{

    await createPeer();

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio:true,

        video:currentCallType==="video"

      });

    localStream.getTracks().forEach(track=>{

      peer.addTrack(track,localStream);

    });

    $("localVideo").srcObject =
      localStream;

    if(currentCallType==="voice"){

      $("localVideo").style.display="none";

    }else{

      $("localVideo").style.display="block";

    }

    await peer.setRemoteDescription(
      new RTCSessionDescription(data.offer)
    );

    const answer =
      await peer.createAnswer();

    await peer.setLocalDescription(answer);

    socket.emit("call:answer",{

      callerId,

      receiverId:currentUser.id,

      answer

    });

  }catch(error){

    console.error(error);

    toast("Call permission error");

    endCall(false);

  }

});


/* ANSWER */

socket.on("call:answer",async data=>{

  if(!peer)return;

  try{

    await peer.setRemoteDescription(
      new RTCSessionDescription(data.answer)
    );

    $("callStatus").textContent =
      "কল connected ❤️";

  }catch(error){

    console.error(error);

  }

});


/* ICE */

socket.on("call:ice",async data=>{

  if(!peer || !data.candidate)return;

  try{

    await peer.addIceCandidate(
      new RTCIceCandidate(data.candidate)
    );

  }catch(error){

    console.error("ICE error",error);

  }

});


/* REJECT */

socket.on("call:rejected",()=>{

  $("callStatus").textContent =
    "কলটি গ্রহণ করা হয়নি";

  setTimeout(()=>endCall(false),1200);

});


/* END */

socket.on("call:ended",()=>{

  toast("কল শেষ হয়েছে");

  endCall(false);

});


function toggleMute(){

  if(!localStream)return;

  const track =
    localStream.getAudioTracks()[0];

  if(track){

    track.enabled=!track.enabled;

    toast(
      track.enabled
      ?"Microphone ON"
      :"Microphone OFF"
    );

  }

}

function toggleCamera(){

  if(!localStream)return;

  const track =
    localStream.getVideoTracks()[0];

  if(track){

    track.enabled=!track.enabled;

    toast(
      track.enabled
      ?"Camera ON"
      :"Camera OFF"
    );

  }

}

function endCall(sendSignal=true){

  if(
    sendSignal &&
    currentCallUser
  ){

    socket.emit("call:end",{

      targetUserId:currentCallUser.id,

      from:currentUser.id

    });

  }

  if(localStream){

    localStream.getTracks().forEach(
      track=>track.stop()
    );

  }

  localStream=null;

  if(peer){

    peer.close();

  }

  peer=null;

  $("remoteVideo").srcObject=null;

  $("localVideo").srcObject=null;

  $("callModal").classList.add("hidden");

  currentCallUser=null;

}


/* ======================================================
   UTILITIES
====================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function formatDate(value){

  if(!value)return "";

  const d=new Date(value);

  return d.toLocaleString(
    "bn-BD",
    {
      day:"numeric",
      month:"short",
      hour:"numeric",
      minute:"2-digit"
    }
  );

}

====================================================== */

socket.on("connect",()=>{

  console.log(
    "Socket connected:",
    socket.id
  );

  if(currentUser){

    socket.emit("user:online",{

      userId:currentUser.id,

      name:currentUser.name,

      phone:currentUser.phone

    });

  }

});

socket.on("disconnect",()=>{

  console.log("Socket disconnected");

});
