<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ShakibYS Messenger</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#111827;
}

button,input{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.12);
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:900;
    color:#ff2a5f;
    margin-bottom:10px;
}

.loginBox p{
    color:#64748b;
    margin-bottom:25px;
}

.loginBox input{
    width:100%;
    padding:15px;
    border:1px solid #e2e8f0;
    border-radius:15px;
    outline:none;
    margin-bottom:15px;
}

.primary{
    width:100%;
    border:0;
    padding:15px;
    border-radius:15px;
    background:linear-gradient(135deg,#ff2a5f,#e01b4d);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* APP */

#app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

.top{
    height:65px;
    background:white;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.brand{
    font-size:24px;
    font-weight:900;
    color:#ff2a5f;
}

.status{
    font-size:12px;
    color:#16a34a;
}

.main{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* SIDEBAR */

.sidebar{
    width:320px;
    background:white;
    border-right:1px solid #e2e8f0;
    overflow-y:auto;
}

.sidebarTitle{
    padding:18px;
    font-size:18px;
    font-weight:bold;
}

.user{
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border-bottom:1px solid #f1f5f9;
}

.user:hover{
    background:#f8fafc;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff2a5f,#ff758f);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.userName{
    font-weight:bold;
}

.online{
    font-size:11px;
    color:#16a34a;
    margin-top:4px;
}

/* CHAT */

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    background:#f8fafc;
}

.chatHeader{
    height:65px;
    background:white;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    align-items:center;
    padding:0 18px;
    font-weight:bold;
}

.chatHeader small{
    display:block;
    font-size:11px;
    color:#16a34a;
    margin-top:3px;
}

.messages{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    max-width:75%;
    padding:11px 14px;
    border-radius:17px;
    font-size:14px;
    line-height:1.4;
}

.me{
    align-self:flex-end;
    background:#ff2a5f;
    color:white;
    border-bottom-right-radius:5px;
}

.other{
    align-self:flex-start;
    background:white;
    border:1px solid #e2e8f0;
    border-bottom-left-radius:5px;
}

.messageName{
    font-size:10px;
    font-weight:bold;
    margin-bottom:3px;
    opacity:.8;
}

.time{
    font-size:9px;
    opacity:.7;
    margin-top:4px;
}

.system{
    align-self:center;
    color:#64748b;
    font-size:11px;
    background:#e2e8f0;
    padding:7px 12px;
    border-radius:20px;
}

/* INPUT */

.inputArea{
    background:white;
    border-top:1px solid #e2e8f0;
    padding:12px;
    display:flex;
    gap:8px;
}

.inputArea input{
    flex:1;
    padding:13px 16px;
    border:1px solid #e2e8f0;
    border-radius:25px;
    outline:none;
}

.send{
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#ff2a5f;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        width:90px;
    }

    .sidebarTitle{
        font-size:12px;
        text-align:center;
        padding:12px 4px;
    }

    .user{
        justify-content:center;
        padding:12px 5px;
    }

    .userInfo{
        display:none;
    }

    .avatar{
        width:48px;
        height:48px;
    }

    .message{
        max-width:85%;
    }
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="loginBox">

        <div class="logo">
            ShakibYS
        </div>

        <p>
            আপনার নাম দিয়ে Messenger-এ প্রবেশ করুন
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="30"
            placeholder="আপনার নাম লিখুন"
        >

        <button
            class="primary"
            onclick="join()"
        >
            Messenger-এ প্রবেশ করুন
        </button>

    </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

    <div class="top">

        <div class="brand">
            ShakibYS
        </div>

        <div class="status">
            ● Live
        </div>

    </div>


    <div class="main">

        <!-- USERS -->

        <div class="sidebar">

            <div class="sidebarTitle">
                👥 Online Users
            </div>

            <div id="users"></div>

        </div>


        <!-- CHAT -->

        <div class="chat">

            <div class="chatHeader">

                <div id="chatTitle">
                    🌍 Global Chat
                    <small>সবাই এখানে দেখতে পাবে</small>
                </div>

            </div>


            <div
                id="messages"
                class="messages"
            ></div>


            <div class="inputArea">

                <input
                    id="messageInput"
                    type="text"
                    maxlength="1000"
                    placeholder="মেসেজ লিখুন..."
                    onkeydown="handleEnter(event)"
                >

                <button
                    class="send"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>

</div>


<script>

const socket = io();

let myName = "";
let selectedUser = null;


/* LOGIN */

function join(){

    const input =
        document.getElementById("nameInput");

    const name =
        input.value.trim();

    if(!name){

        alert("আপনার নাম লিখুন");

        return;
    }

    myName = name;

    localStorage.setItem(
        "shakibys_name",
        myName
    );

    socket.emit(
        "join",
        myName
    );

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    input.value = "";
}


/* AUTO LOGIN */

window.addEventListener("load",()=>{

    const saved =
        localStorage.getItem("shakibys_name");

    if(saved){

        myName = saved;

        socket.emit(
            "join",
            myName
        );

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("app")
            .classList.remove("hidden");
    }

});


/* USERS */

socket.on("users",(users)=>{

    const container =
        document.getElementById("users");

    container.innerHTML = "";

    users.forEach(user=>{

        if(user.id === socket.id)
            return;

        const div =
            document.createElement("div");

        div.className = "user";

        div.onclick = () =>
            selectUser(user);

        const avatar =
            document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
            user.name.charAt(0).toUpperCase();

        const info =
            document.createElement("div");

        info.className = "userInfo";

        info.innerHTML = `
            <div class="userName">
                ${escapeHTML(user.name)}
            </div>

            <div class="online">
                ● Online
            </div>
        `;

        div.appendChild(avatar);
        div.appendChild(info);

        container.appendChild(div);

    });

});


/* SELECT USER */

function selectUser(user){

    selectedUser = user;

    document
        .getElementById("chatTitle")
        .innerHTML = `
            💬 ${escapeHTML(user.name)}
            <small>● Online</small>
        `;

}


/* PUBLIC MESSAGE */

socket.on("public_message",(data)=>{

    addMessage(
        data.sender,
        data.text,
        data.senderId === socket.id,
        data.time
    );

});


/* PRIVATE MESSAGE */

socket.on("private_message",(data)=>{

    addMessage(
        data.sender,
        data.text,
        data.senderId === socket.id,
        data.time
    );

});


/* SYSTEM */

socket.on("system_message",(data)=>{

    const box =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className = "system";

    div.textContent = data.text;

    box.appendChild(div);

    scrollBottom();

});


/* ADD MESSAGE */

function addMessage(
    sender,
    text,
    mine,
    time
){

    const box =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (mine ? "me" : "other");

    const date =
        new Date(time);

    const timeText =
        date.toLocaleTimeString(
            "bn-BD",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    div.innerHTML = `

        <div class="messageName">
            ${escapeHTML(sender)}
        </div>

        <div>
            ${escapeHTML(text)}
        </div>

        <div class="time">
            ${timeText}
        </div>

    `;

    box.appendChild(div);

    scrollBottom();
}


/* SEND */

function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text)
        return;


    if(selectedUser){

        socket.emit(
            "private_message",
            {
                receiverId:selectedUser.id,
                text:text
            }
        );

    }else{

        socket.emit(
            "public_message",
            {
                text:text
            }
        );

    }

    input.value = "";

    input.focus();
}


/* ENTER */

function handleEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

}


/* SCROLL */

function scrollBottom(){

    const box =
        document.getElementById("messages");

    box.scrollTop =
        box.scrollHeight;

}


/* SECURITY */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
