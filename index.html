<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShakibYS</title>
<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f9;
  color:#222;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

header{
  position:sticky;
  top:0;
  z-index:50;
  height:62px;
  background:#fff;
  box-shadow:0 2px 12px #0001;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:12px;
}
.logo{
  font-size:24px;
  font-weight:900;
  color:#e83e8c;
}
.search{
  flex:1;
  max-width:420px;
  position:relative;
}
.search input{
  width:100%;
  border:0;
  outline:0;
  background:#f1f2f6;
  border-radius:25px;
  padding:12px 18px;
}
.search-results{
  position:absolute;
  top:52px;
  left:0;
  right:0;
  background:white;
  border-radius:15px;
  box-shadow:0 8px 30px #0002;
  max-height:350px;
  overflow:auto;
}
.user-result{
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee;
}
.user-result:hover{background:#fafafa}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ffe1ef;
  color:#e83e8c;
  font-size:20px;
}
.icon-btn:hover{background:#e83e8c;color:white}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#ffd3e6;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e83e8c;
  font-weight:bold;
}
.avatar.big{
  width:85px;
  height:85px;
  font-size:30px;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 12px;
}
.grid{
  display:grid;
  grid-template-columns:240px 1fr 260px;
  gap:18px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:0 2px 12px #0000000c;
  margin-bottom:15px;
}
.menu button{
  width:100%;
  padding:12px;
  margin:4px 0;
  border-radius:12px;
  background:white;
  text-align:left;
}
.menu button:hover{
  background:#ffe6f1;
  color:#e83e8c;
}

.profile-mini{
  text-align:center;
}
.profile-mini .avatar{
  margin:auto;
}

.post-box textarea{
  width:100%;
  resize:none;
  border:0;
  outline:0;
  background:#f5f6f9;
  border-radius:15px;
  padding:13px;
  min-height:80px;
}
.row{
  display:flex;
  align-items:center;
  gap:8px;
}
.between{
  justify-content:space-between;
}
.primary{
  background:#e83e8c;
  color:white;
  padding:10px 18px;
  border-radius:25px;
  font-weight:bold;
}
.secondary{
  background:#ffe2ef;
  color:#d52c7d;
  padding:9px 15px;
  border-radius:22px;
}
.post{
  padding:15px;
  border-bottom:1px solid #eee;
}
.post:last-child{border:0}
.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}
.post-media{
  width:100%;
  max-height:450px;
  object-fit:cover;
  border-radius:14px;
  margin-top:10px;
}
.post-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}
.post-actions button{
  flex:1;
  background:#f4f4f7;
  padding:9px;
  border-radius:12px;
}
.post-actions button:hover{
  background:#ffe3ef;
  color:#e83e8c;
}

.badge{
  background:#e83e8c;
  color:white;
  border-radius:20px;
  padding:2px 7px;
  font-size:11px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:20px;
}
.close{
  float:right;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#eee;
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#ffe6f1,#fff);
}
.auth-box{
  width:100%;
  max-width:390px;
  background:white;
  border-radius:25px;
  padding:28px;
  box-shadow:0 10px 40px #0002;
}
.auth-box input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:13px;
  outline:0;
}
.auth-box input:focus{border-color:#e83e8c}

.chat{
  height:70vh;
  display:flex;
  flex-direction:column;
}
.chat-head{
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee;
  padding-bottom:10px;
}
.messages{
  flex:1;
  overflow:auto;
  padding:15px 3px;
}
.msg{
  max-width:75%;
  padding:10px 13px;
  border-radius:17px;
  margin:6px 0;
  background:#eee;
  clear:both;
}
.msg.mine{
  margin-left:auto;
  background:#e83e8c;
  color:white;
}
.chat-input{
  display:flex;
  gap:7px;
  padding-top:10px;
}
.chat-input input{
  flex:1;
  border:0;
  background:#f1f2f5;
  border-radius:25px;
  padding:12px;
  outline:0;
}

.notification{
  padding:12px;
  border-bottom:1px solid #eee;
}
.online{
  width:10px;
  height:10px;
  background:#21c55d;
  border-radius:50%;
  display:inline-block;
}

.call-screen{
  position:fixed;
  inset:0;
  background:#111;
  z-index:200;
  color:white;
  display:flex;
  flex-direction:column;
}
.call-video{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}
#localVideo{
  position:absolute;
  right:15px;
  top:15px;
  width:120px;
  height:170px;
  object-fit:cover;
  border-radius:15px;
  border:2px solid white;
}
.call-buttons{
  padding:20px;
  display:flex;
  justify-content:center;
  gap:15px;
}
.call-buttons button{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#333;
  color:white;
  font-size:22px;
}
.call-buttons .end{
  background:#e11;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 20px;
  border-radius:25px;
  z-index:500;
}

@media(max-width:850px){
  .grid{grid-template-columns:1fr}
  .left,.right{display:none}
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authPage" class="auth">
  <div class="auth-box">
    <div class="logo" style="text-align:center;font-size:32px">ShakibYS</div>
    <p style="text-align:center;color:#777">Connect with everyone</p>

    <div id="loginForm">
      <input id="loginPhone" type="tel" placeholder="মোবাইল নাম্বার">
      <button class="primary" style="width:100%" onclick="login()">Login</button>
      <p style="text-align:center">
        অ্যাকাউন্ট নেই?
        <button class="secondary" onclick="showRegister()">Register</button>
      </p>
    </div>

    <div id="registerForm" class="hidden">
      <input id="regName" placeholder="আপনার নাম">
      <input id="regPhone" type="tel" placeholder="মোবাইল নাম্বার">
      <button class="primary" style="width:100%" onclick="registerUser()">Create Account</button>
      <p style="text-align:center">
        আগে থেকেই অ্যাকাউন্ট আছে?
        <button class="secondary" onclick="showLogin()">Login</button>
      </p>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appPage" class="hidden">

<header>
  <div class="logo">ShakibYS</div>

  <div class="search">
    <input id="searchInput"
           placeholder="🔎 User খুঁজুন..."
           oninput="searchUsers()">
    <div id="searchResults" class="search-results hidden"></div>
  </div>

  <button class="icon-btn" onclick="openNotifications()">🔔</button>
  <button class="icon-btn" onclick="openProfile(currentUser.id)">👤</button>
</header>

<div class="container">
<div class="grid">

<!-- LEFT -->
<div class="left">

  <div class="card profile-mini">
    <div class="avatar big" id="miniAvatar">S</div>
    <h3 id="miniName">Shakib</h3>
    <small id="miniPhone"></small>
  </div>

  <div class="card menu">
    <button onclick="loadFeed()">🏠 Home</button>
    <button onclick="openProfile(currentUser.id)">👤 Profile</button>
    <button onclick="openMessenger()">💬 Messenger</button>
    <button onclick="openNotifications()">🔔 Notifications</button>
    <button onclick="showFriends()">👥 Friends</button>
    <button onclick="showFollowers()">❤️ Followers</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>

</div>

<!-- CENTER -->
<div>

  <div class="card post-box">
    <div class="row">
      <div class="avatar" id="postAvatar">S</div>
      <b id="postName">Shakib</b>
    </div>

    <textarea id="postText"
      placeholder="আপনার মনে কী আছে?"></textarea>

    <div class="row between" style="margin-top:10px">
      <label class="secondary">
        📷 Photo/Video
        <input id="mediaInput"
               type="file"
               accept="image/*,video/*"
               style="display:none"
               onchange="previewMedia(event)">
      </label>

      <button class="primary" onclick="createPost()">Post</button>
    </div>

    <div id="mediaPreview"></div>
  </div>

  <div class="card">
    <h3>📰 News Feed</h3>
    <div id="feed"></div>
  </div>

</div>

<!-- RIGHT -->
<div class="right">

  <div class="card">
    <h3>🟢 Online</h3>
    <div id="onlineList">User online হলে এখানে দেখা যাবে</div>
  </div>

  <div class="card">
    <h3>⚡ Quick Menu</h3>
    <button class="secondary" style="width:100%;margin:4px"
            onclick="openMessenger()">💬 Messenger</button>
    <button class="secondary" style="width:100%;margin:4px"
            onclick="openNotifications()">🔔 Notifications</button>
  </div>

</div>

</div>
</div>
</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal('profileModal')">×</button>

    <div style="text-align:center">
      <div class="avatar big" id="profileAvatar" style="margin:auto">U</div>
      <h2 id="profileName">User</h2>
      <p id="profileBio"></p>

      <div class="row" style="justify-content:center">
        <span><b id="followersCount">0</b> Followers</span>
        <span><b id="followingCount">0</b> Following</span>
        <span><b id="friendsCount">0</b> Friends</span>
      </div>

      <div id="profileActions" style="margin-top:15px"></div>
    </div>
  </div>
</div>

<!-- CHAT MODAL -->
<div id="chatModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal('chatModal')">×</button>

    <div class="chat">
      <div class="chat-head">
        <div class="avatar" id="chatAvatar">U</div>
        <div>
          <b id="chatName">User</b>
          <br>
          <small id="chatStatus">offline</small>
        </div>

        <div style="margin-left:auto">
          <button class="icon-btn" onclick="startCall('voice')">📞</button>
          <button class="icon-btn" onclick="startCall('video')">🎥</button>
        </div>
      </div>

      <div id="messages" class="messages"></div>

      <div class="chat-input">
        <input id="messageInput"
               placeholder="Message লিখুন..."
               onkeydown="if(event.key==='Enter')sendMessage()"
               oninput="typingStart()">
        <button class="primary" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- NOTIFICATION MODAL -->
<div id="notificationModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal('notificationModal')">×</button>
    <h2>🔔 Notifications</h2>
    <div id="notificationList"></div>
  </div>
</div>

<!-- CALL SCREEN -->
<div id="callScreen" class="call-screen hidden">

  <div style="padding:18px;text-align:center">
    <h2 id="callTitle">Calling...</h2>
    <small id="callStatus">Connecting...</small>
  </div>

  <div class="call-video">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <div class="call-buttons">
    <button onclick="toggleMute()">🎤</button>
    <button onclick="toggleCamera()">📷</button>
    <button class="end" onclick="endCall()">📵</button>
  </div>

</div>

<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   GLOBAL
========================================================= */

const socket = io();

let currentUser =
  JSON.parse(localStorage.getItem("shakibys_user") || "null");

let currentChatUser = null;
let currentCallUser = null;

let peerConnection = null;
let localStream = null;
let currentCallType = "voice";

const iceServers = {
  iceServers: [
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"}
  ]
};

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function toast(text){
  $("toast").textContent = text;
  $("toast").classList.remove("hidden");

  setTimeout(()=>{
    $("toast").classList.add("hidden");
  },2500);
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function closeModal(id){
  $(id).classList.add("hidden");
}

function showRegister(){
  $("loginForm").classList.add("hidden");
  $("registerForm").classList.remove("hidden");
}

function showLogin(){
  $("registerForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
}

/* =========================================================
   AUTH
========================================================= */

async function registerUser(){

  const name = $("regName").value.trim();
  const phone = $("regPhone").value.trim();

  if(!name || !phone){
    toast("নাম ও মোবাইল নাম্বার দিন");
    return;
  }

  const res = await fetch("/api/auth/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,phone})
  });

  const data = await res.json();

  if(!data.success){
    toast(data.message || "Register failed");
    return;
  }

  currentUser = data.user;

  localStorage.setItem(
    "shakibys_user",
    JSON.stringify(currentUser)
  );

  enterApp();
}

async function login(){

  const phone = $("loginPhone").value.trim();

  if(!phone){
    toast("মোবাইল নাম্বার দিন");
    return;
  }

  const res = await fetch("/api/auth/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({phone})
  });

  const data = await res.json();

  if(!data.success){
    toast(data.message || "Login failed");
    return;
  }

  currentUser = data.user;

  localStorage.setItem(
    "shakibys_user",
    JSON.stringify(currentUser)
  );

  enterApp();
}

function enterApp(){

  $("authPage").classList.add("hidden");
  $("appPage").classList.remove("hidden");

  updateMiniProfile();

  socket.emit("user:online",{
    userId:currentUser.id,
    name:currentUser.name,
    phone:currentUser.phone
  });

  loadFeed();
}

function logout(){

  localStorage.removeItem("shakibys_user");
  location.reload();
}

/* =========================================================
   INITIAL
========================================================= */

if(currentUser){
  enterApp();
}

/* =========================================================
   PROFILE MINI
========================================================= */

function updateMiniProfile(){

  $("miniName").textContent =
    currentUser.name;

  $("miniPhone").textContent =
    currentUser.phone;

  $("postName").textContent =
    currentUser.name;

  $("miniAvatar").textContent =
    currentUser.name.charAt(0).toUpperCase();

  $("postAvatar").textContent =
    currentUser.name.charAt(0).toUpperCase();
}

/* =========================================================
   SEARCH USERS
========================================================= */

let searchTimer;

function searchUsers(){

  clearTimeout(searchTimer);

  const q =
    $("searchInput").value.trim();

  if(!q){
    $("searchResults").classList.add("hidden");
    return;
  }

  searchTimer = setTimeout(async()=>{

    const res =
      await fetch(
        "/api/users?q="+
        encodeURIComponent(q)
      );

    const data = await res.json();

    const box = $("searchResults");

    box.innerHTML = "";

    if(!data.users.length){
      box.innerHTML =
        "<div style='padding:15px'>কোনো User পাওয়া যায়নি</div>";

      box.classList.remove("hidden");
      return;
    }

    data.users.forEach(user=>{

      const div =
        document.createElement("div");

      div.className = "user-result";

      div.innerHTML = `
        <div class="avatar">
          ${escapeHtml(user.name.charAt(0))}
        </div>

        <div style="flex:1">
          <b>${escapeHtml(user.name)}</b><br>
          <small>${escapeHtml(user.phone)}</small>
        </div>

        <button class="secondary"
          onclick="openProfile('${user.id}')">
          Profile
        </button>
      `;

      box.appendChild(div);
    });

    box.classList.remove("hidden");

  },300);
}

/* =========================================================
   PROFILE
========================================================= */

async function openProfile(userId){

  const res =
    await fetch("/api/users/"+userId);

  const data = await res.json();

  if(!data.success){
    toast("User পাওয়া যায়নি");
    return;
  }

  const user = data.user;

  $("profileName").textContent =
    user.name;

  $("profileBio").textContent =
    user.bio || "No bio";

  $("profileAvatar").textContent =
    user.name.charAt(0).toUpperCase();

  $("followersCount").textContent =
    user.followers || 0;

  $("followingCount").textContent =
    user.following || 0;

  $("friendsCount").textContent =
    user.friends || 0;

  const actions = $("profileActions");

  actions.innerHTML = "";

  if(String(user.id) === String(currentUser.id)){

    actions.innerHTML = `
      <button class="primary"
        onclick="openMessenger()">
        💬 Messenger
      </button>
    `;

  }else{

    actions.innerHTML = `
      <button class="primary"
        onclick="followUser('${user.id}')">
        ➕ Follow
      </button>

      <button class="secondary"
        onclick="sendFriendRequest('${user.id}')">
        👥 Friend Request
      </button>

      <button class="secondary"
        onclick="openChat('${user.id}')">
        💬 Message
      </button>
    `;
  }

  $("profileModal").classList.remove("hidden");
}

/* =========================================================
   FOLLOW
========================================================= */

async function followUser(userId){

  const res =
    await fetch("/api/follow",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        followerId:currentUser.id,
        followingId:userId
      })
    });

  const data = await res.json();

  if(data.success){
    toast("Follow করা হয়েছে ❤️");
  }else{
    toast(data.message || "Follow failed");
  }
}

/* =========================================================
   FRIEND REQUEST
========================================================= */

async function sendFriendRequest(userId){

  const res =
    await fetch("/api/friends/request",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        fromId:currentUser.id,
        toId:userId
      })
    });

  const data = await res.json();

  if(data.success){
    toast("Friend Request পাঠানো হয়েছে 👥");
  }else{
    toast(data.message || "Request failed");
  }
}

/* =========================================================
   FEED
========================================================= */

async function loadFeed(){

  const res =
    await fetch("/api/posts");

  const data = await res.json();

  renderPosts(data.posts || []);
}

function renderPosts(posts){

  const feed = $("feed");

  feed.innerHTML = "";

  if(!posts.length){
    feed.innerHTML =
      "<p style='text-align:center;color:#777'>এখনো কোনো Post নেই</p>";
    return;
  }

  posts.forEach(post=>{

    const div =
      document.createElement("div");

    div.className = "post";

    let mediaHtml = "";

    if(post.media){

      if(post.type === "video"){
        mediaHtml =
          `<video class="post-media"
             src="${escapeHtml(post.media)}"
             controls></video>`;
      }else{
        mediaHtml =
          `<img class="post-media"
             src="${escapeHtml(post.media)}">`;
      }
    }

    div.innerHTML = `
      <div class="post-head">
        <div class="avatar">
          ${escapeHtml(
            (post.author || "U").charAt(0)
          )}
        </div>

        <div>
          <b>${escapeHtml(post.author)}</b><br>
          <small>${new Date(post.createdAt).toLocaleString()}</small>
        </div>
      </div>

      <p>${escapeHtml(post.content)}</p>

      ${mediaHtml}

      <div class="post-actions">
        <button onclick="likePost('${post.id}')">❤️ Like</button>
        <button onclick="commentPost('${post.id}')">💬 Comment</button>
        <button onclick="sharePost('${post.id}')">↗ Share</button>
      </div>
    `;

    feed.appendChild(div);
  });
}

/* =========================================================
   CREATE POST
========================================================= */

let selectedMedia = "";

function previewMedia(event){

  const file =
    event.target.files[0];

  if(!file)return;

  const reader =
    new FileReader();

  reader.onload = e=>{

    selectedMedia =
      e.target.result;

    $("mediaPreview").innerHTML =
      file.type.startsWith("video")
      ?
      `<video src="${selectedMedia}"
              style="max-width:100%;max-height:250px"
              controls></video>`
      :
      `<img src="${selectedMedia}"
            style="max-width:100%;max-height:250px;border-radius:12px">`;
  };

  reader.readAsDataURL(file);
}

async function createPost(){

  const content =
    $("postText").value.trim();

  const file =
    $("mediaInput").files[0];

  let type = "text";

  if(file){
    type =
      file.type.startsWith("video")
      ? "video"
      : "image";
  }

  if(!content && !selectedMedia){
    toast("Post লিখুন অথবা ছবি/ভিডিও দিন");
    return;
  }

  const res =
    await fetch("/api/posts",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        authorId:currentUser.id,
        author:currentUser.name,
        content,
        type,
        media:selectedMedia,
        privacy:"public"
      })
    });

  const data = await res.json();

  if(data.success){

    $("postText").value = "";
    $("mediaInput").value = "";
    $("mediaPreview").innerHTML = "";
    selectedMedia = "";

    toast("Post হয়েছে 🎉");
  }else{
    toast(data.message || "Post হয়নি");
  }
}

function likePost(id){
  toast("❤️ Like");
}

function commentPost(id){

  const text =
    prompt("Comment লিখুন");

  if(text){
    toast("Comment করা হয়েছে 💬");
  }
}

function sharePost(id){
  toast("Post Share করা হয়েছে ↗");
}

/* =========================================================
   MESSENGER
========================================================= */

function openMessenger(){

  const q =
    prompt(
      "যাকে Message করতে চান তার নাম বা নম্বর লিখুন:"
    );

  if(!q)return;

  searchForChatUser(q);
}

async function searchForChatUser(q){

  const res =
    await fetch(
      "/api/users?q="+
      encodeURIComponent(q)
    );

  const data =
    await res.json();

  const user =
    data.users.find(
      u =>
        String(u.id) !==
        String(currentUser.id)
    );

  if(!user){
    toast("User পাওয়া যায়নি");
    return;
  }

  openChat(user.id);
}

async function openChat(userId){

  closeModal("profileModal");

  const res =
    await fetch("/api/users/"+userId);

  const data =
    await res.json();

  if(!data.success){
    toast("User পাওয়া যায়নি");
    return;
  }

  currentChatUser =
    data.user;

  $("chatName").textContent =
    currentChatUser.name;

  $("chatAvatar").textContent =
    currentChatUser.name
      .charAt(0)
      .toUpperCase();

  $("chatStatus").textContent =
    currentChatUser.online
    ? "🟢 Online"
    : "Offline";

  $("messages").innerHTML = "";

  $("chatModal").classList.remove("hidden");

  socket.emit("message:history",{
    userA:currentUser.id,
    userB:currentChatUser.id
  });
}

function sendMessage(){

  if(!currentChatUser)return;

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text)return;

  socket.emit("message:send",{
    senderId:currentUser.id,
    senderName:currentUser.name,
    receiverId:currentChatUser.id,
    text,
    type:"text"
  });

  input.value = "";
}

function renderMessage(message){

  const div =
    document.createElement("div");

  div.className =
    "msg " +
    (
      String(message.senderId) ===
      String(currentUser.id)
      ? "mine"
      : ""
    );

  div.textContent =
    message.text;

  $("messages").appendChild(div);

  $("messages").scrollTop =
    $("messages").scrollHeight;
}

/* =========================================================
   TYPING
========================================================= */

let typingTimer;

function typingStart(){

  if(!currentChatUser)return;

  socket.emit("typing:start",{
    receiverId:currentChatUser.id,
    senderName:currentUser.name
  });

  clearTimeout(typingTimer);

  typingTimer =
    setTimeout(()=>{
      socket.emit("typing:stop",{
        receiverId:currentChatUser.id
      });
    },1000);
}

/* =========================================================
   SOCKET EVENTS
========================================================= */

socket.on("message:history",messages=>{

  $("messages").innerHTML = "";

  messages.forEach(renderMessage);
});

socket.on("message:new",message=>{

  if(
    currentChatUser &&
    (
      String(message.senderId) ===
      String(currentChatUser.id)
      ||
      String(message.receiverId) ===
      String(currentChatUser.id)
    )
  ){
    renderMessage(message);
  }

  if(
    String(message.receiverId) ===
    String(currentUser?.id)
  ){
    toast("💬 নতুন Message এসেছে");
  }
});

socket.on("post:created",post=>{

  loadFeed();

});

socket.on("post:deleted",()=>{
  loadFeed();
});

socket.on("user:status",data=>{

  if(
    currentChatUser &&
    String(data.userId) ===
    String(currentChatUser.id)
  ){
    $("chatStatus").textContent =
      data.online
      ? "🟢 Online"
      : "Offline";
  }
});

socket.on("typing:start",data=>{

  if(currentChatUser){
    $("chatStatus").textContent =
      "✍️ typing...";
  }
});

socket.on("typing:stop",()=>{

  if(currentChatUser){
    $("chatStatus").textContent =
      currentChatUser.online
      ? "🟢 Online"
      : "Offline";
  }
});

/* =========================================================
   NOTIFICATIONS
========================================================= */

async function openNotifications(){

  const res =
    await fetch(
      "/api/notifications/"+
      currentUser.id
    );

  const data =
    await res.json();

  const box =
    $("notificationList");

  box.innerHTML = "";

  if(!data.notifications.length){
    box.innerHTML =
      "<p>কোনো Notification নেই</p>";
  }

  data.notifications.forEach(n=>{

    const div =
      document.createElement("div");

    div.className =
      "notification";

    let text = "";

    if(n.type === "friend_request"){
      text =
        `👥 ${escapeHtml(n.fromUserName)}
        আপনাকে Friend Request দিয়েছে`;
    }
    else if(n.type === "friend_accepted"){
      text =
        `✅ ${escapeHtml(n.fromUserName)}
        আপনার Friend Request গ্রহণ করেছে`;
    }
    else if(n.type === "follow"){
      text =
        `❤️ ${escapeHtml(n.fromUserName)}
        আপনাকে Follow করেছে`;
    }
    else{
      text = "🔔 নতুন Notification";
    }

    div.innerHTML =
      `<div>${text}</div>
       <small>${new Date(n.createdAt).toLocaleString()}</small>`;

    box.appendChild(div);
  });

  $("notificationModal")
    .classList.remove("hidden");
}

socket.on("notification:new",n=>{

  toast(
    "🔔 "+n.fromUserName+
    " থেকে নতুন Notification"
  );
});

   FRIENDS / FOLLOWERS
========================================================= */

function showFriends(){
  toast("Friends system চালু আছে 👥");
}

function showFollowers(){
  toast("Followers system চালু আছে ❤️");
}

/* =========================================================
   CALL — WEBRTC
========================================================= */

async function createPeer(){

  peerConnection =
    new RTCPeerConnection(
      iceServers
    );

  peerConnection.onicecandidate =
    event=>{

      if(event.candidate &&
         currentCallUser){

        socket.emit("call:ice",{
          targetUserId:
            currentCallUser.id,
          candidate:
            event.candidate
        });
      }
    };

  peerConnection.ontrack =
    event=>{

      $("remoteVideo").srcObject =
        event.streams[0];
    };

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        peerConnection
          .addTrack(
            track,
            localStream
          );
      });
  }

  return peerConnection;
}

async function startCall(type){

  if(!currentChatUser){
    toast("আগে একজন User-এর Chat খুলুন");
    return;
  }

  currentCallType =
    type;

  currentCallUser =
    currentChatUser;

  try{

    localStream =
      await navigator.mediaDevices
      .getUserMedia({
        audio:true,
        video:type === "video"
      });

    $("localVideo").srcObject =
      localStream;

    $("callScreen")
      .classList.remove("hidden");

    $("callTitle").textContent =
      `${currentCallUser.name}-কে ${
        type === "video"
        ? "Video"
        : "Voice"
      } Call`;

    $("callStatus").textContent =
      "Calling...";

    await createPeer();

    const offer =
      await peerConnection
        .createOffer();

    await peerConnection
      .setLocalDescription(
        offer
      );

    socket.emit("call:offer",{
      receiverId:
        currentCallUser.id,
      callerId:
        currentUser.id,
      callerName:
        currentUser.name,
      callType:type,
      offer
    });

  }catch(error){

    console.error(error);

    toast(
      "Microphone/Camera permission দিন"
    );
  }
}

/* INCOMING CALL */

socket.on("call:offer",async data=>{

  const accept =
    confirm(
      `${data.callerName} আপনাকে ${
        data.callType === "video"
        ? "Video"
        : "Voice"
      } Call দিচ্ছে। গ্রহণ করবেন?`
    );

  if(!accept){

    socket.emit("call:reject",{
      callerId:data.callerId,
      receiverId:currentUser.id
    });

    return;
  }

  currentCallType =
    data.callType;

  currentCallUser = {
    id:data.callerId,
    name:data.callerName
  };

  try{

    localStream =
      await navigator.mediaDevices
      .getUserMedia({
        audio:true,
        video:data.callType === "video"
      });

    $("localVideo").srcObject =
      localStream;

    $("callScreen")
      .classList.remove("hidden");

    $("callTitle").textContent =
      `${data.callerName} Calling...`;

    $("callStatus").textContent =
      "Connected";

    await createPeer();

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

    const answer =
      await peerConnection
        .createAnswer();

    await peerConnection
      .setLocalDescription(
        answer
      );

    socket.emit("call:answer",{
      callerId:data.callerId,
      receiverId:currentUser.id,
      answer
    });

  }catch(error){

    console.error(error);

    toast(
      "Camera/Microphone চালু করা যায়নি"
    );
  }
});

/* ANSWER */

socket.on("call:answer",async data=>{

  if(!peerConnection)return;

  await peerConnection
    .setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

  $("callStatus").textContent =
    "Connected";
});

/* ICE */

socket.on("call:ice",async data=>{

  try{

    if(
      peerConnection &&
      data.candidate
    ){

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );
    }

  }catch(error){
    console.error(error);
  }
});

/* REJECT */

socket.on("call:rejected",()=>{
  toast("Call গ্রহণ করা হয়নি");
  endCall(false);
});

/* END */

socket.on("call:ended",()=>{
  toast("Call শেষ হয়েছে");
  endCall(false);
});

/* =========================================================
   CALL CONTROLS
========================================================= */

function toggleMute(){

  if(!localStream)return;

  const track =
    localStream
      .getAudioTracks()[0];

  if(track){
    track.enabled =
      !track.enabled;

    toast(
      track.enabled
      ? "Microphone ON"
      : "Microphone OFF"
    );
  }
}

function toggleCamera(){

  if(!localStream)return;

  const track =
    localStream
      .getVideoTracks()[0];

  if(track){
    track.enabled =
      !track.enabled;

    toast(
      track.enabled
      ? "Camera ON"
      : "Camera OFF"
    );
  }
}

function endCall(sendSignal=true){

  if(
    sendSignal &&
    currentCallUser
  ){

    socket.emit("call:end",{
      targetUserId:
        currentCallUser.id,
      from:
        currentUser.id
    });
  }

  if(peerConnection){

    peerConnection.close();
    peerConnection = null;
  }

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>track.stop());

    localStream = null;
  }

  $("localVideo").srcObject = null;
  $("remoteVideo").srcObject = null;

  $("callScreen")
    .classList.add("hidden");

  currentCallUser = null;
}

/* =========================================================
   CLOSE SEARCH WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener("click",event=>{

  const search =
    document.querySelector(".search");

  if(
    search &&
    !search.contains(event.target)
  ){
    $("searchResults")
      .classList.add("hidden");
  }
});

/* =========================================================
   SOCKET CONNECT
========================================================= */

socket.on("connect",()=>{

  console.log(
    "Socket connected:",
    socket.id
  );

  if(currentUser){

    socket.emit("user:online",{
      userId:currentUser.id,
      name:currentUser.name,
      phone:currentUser.phone
    });
  }
});

socket.on("disconnect",()=>{

  console.log("Socket disconnected");
});
