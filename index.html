<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShakibYS Messenger</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
}

:root{
    --primary:#ff2a5f;
    --bg:#f3f4f6;
    --card:#fff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
}

body.dark{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* LOGIN */

#login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:400px;
    background:var(--card);
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px #0002;
}

.logo{
    font-size:35px;
    font-weight:900;
    color:var(--primary);
    margin-bottom:8px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:25px;
}

input{
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    outline:none;
}

.login-input{
    width:100%;
    padding:15px;
    border-radius:14px;
    margin-bottom:12px;
}

.btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:14px;
    background:var(--primary);
    color:white;
    font-weight:bold;
    font-size:15px;
}

/* APP */

#app{
    display:none;
    height:100vh;
}

.top{
    height:62px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.brand{
    color:var(--primary);
    font-size:23px;
    font-weight:900;
}

.top-buttons{
    display:flex;
    gap:8px;
}

.icon-btn{
    border:0;
    background:var(--bg);
    color:var(--text);
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:18px;
}

/* LAYOUT */

.layout{
    display:flex;
    height:calc(100vh - 62px);
}

/* SIDEBAR */

.sidebar{
    width:310px;
    background:var(--card);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.sidebar-title{
    padding:18px;
    font-size:20px;
    font-weight:bold;
}

.search{
    margin:0 15px 12px;
    padding:12px 15px;
    border-radius:20px;
    width:calc(100% - 30px);
}

.user-list{
    overflow:auto;
    flex:1;
}

.user{
    padding:13px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}

.user:hover,
.user.selected{
    background:var(--bg);
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:var(--primary);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    flex-shrink:0;
}

.user-info{
    min-width:0;
    flex:1;
}

.user-name{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.online{
    color:#22c55e;
    font-size:11px;
}

.unread{
    background:var(--primary);
    color:white;
    min-width:20px;
    height:20px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
}

/* CHAT */

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    height:65px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:10px 15px;
    gap:10px;
}

.chat-title{
    font-weight:bold;
}

.chat-status{
    font-size:11px;
    color:#22c55e;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message{
    max-width:75%;
    padding:10px 13px;
    border-radius:16px;
    font-size:14px;
    word-wrap:break-word;
}

.message.me{
    align-self:flex-end;
    background:var(--primary);
    color:white;
    border-bottom-right-radius:4px;
}

.message.other{
    align-self:flex-start;
    background:var(--card);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
}

.sender{
    font-size:10px;
    opacity:.7;
    margin-bottom:3px;
}

.time{
    font-size:9px;
    opacity:.65;
    margin-top:4px;
    text-align:right;
}

.chat-input{
    padding:10px;
    background:var(--card);
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
}

.chat-input input{
    flex:1;
    padding:12px 15px;
    border-radius:25px;
}

.send{
    width:48px;
    height:48px;
    border-radius:50%;
    border:0;
    background:var(--primary);
    color:white;
    font-size:18px;
}

/* EMPTY */

.empty{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:var(--muted);
    padding:30px;
}

.empty-icon{
    font-size:55px;
    margin-bottom:10px;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        width:100%;
    }

    .chat{
        display:none;
    }

    .layout.chat-open .sidebar{
        display:none;
    }

    .layout.chat-open .chat{
        display:flex;
    }

    .mobile-back{
        display:block!important;
    }
}

.mobile-back{
    display:none;
    border:0;
    background:none;
    color:var(--text);
    font-size:20px;
}

/* TOAST */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(80px);
    background:#111827;
    color:white;
    padding:12px 20px;
    border-radius:30px;
    opacity:0;
    transition:.3s;
    z-index:999;
}

#toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

    <div class="login-card">

        <div class="logo">ShakibYS</div>

        <div class="subtitle">
            Connect with everyone 💬
        </div>

        <input
            id="nameInput"
            class="login-input"
            type="text"
            maxlength="30"
            placeholder="আপনার নাম লিখুন">

        <button class="btn" onclick="login()">
            ShakibYS-এ প্রবেশ করুন 🚀
        </button>

    </div>

</div>


<!-- APP -->

<div id="app">

    <div class="top">

        <div class="brand">
            ShakibYS
        </div>

        <div class="top-buttons">

            <button class="icon-btn" onclick="toggleDark()">
                🌙
            </button>

            <button class="icon-btn" onclick="logout()">
                🚪
            </button>

        </div>

    </div>


    <div class="layout" id="layout">

        <!-- USERS -->

        <aside class="sidebar">

            <div class="sidebar-title">
                Messenger
            </div>

            <input
                id="search"
                class="search"
                placeholder="🔎 ইউজার খুঁজুন..."
                oninput="searchUsers()">

            <div id="userList" class="user-list">

                <div class="empty">
                    <div>
                        <div class="empty-icon">👥</div>
                        অপেক্ষা করুন...
                    </div>
                </div>

            </div>

        </aside>


        <!-- CHAT -->

        <main class="chat">

            <div class="chat-header">

                <button
                    class="mobile-back"
                    onclick="closeChat()">
                    ←
                </button>

                <div id="chatAvatar" class="avatar">
                    💬
                </div>

                <div>
                    <div id="chatTitle" class="chat-title">
                        ShakibYS Messenger
                    </div>

                    <div id="chatStatus" class="chat-status">
                        একটি ইউজার নির্বাচন করুন
                    </div>
                </div>

            </div>


            <div id="messages" class="messages">

                <div class="empty">

                    <div>

                        <div class="empty-icon">
                            💬
                        </div>

                        <b>ShakibYS Messenger</b>

                        <p>
                            বাম পাশ থেকে একজন ইউজার নির্বাচন করুন
                        </p>

                    </div>

                </div>

            </div>


            <div class="chat-input">

                <input
                    id="messageInput"
                    placeholder="মেসেজ লিখুন..."
                    maxlength="1000"
                    onkeydown="handleEnter(event)">

                <button
                    class="send"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </main>

    </div>

</div>


<div id="toast"></div>


<script>

let socket = null;

let myName = "";

let myId = "";

let selectedUser = null;

let users = [];

let conversations = {};


// LOGIN

function login(){

    const input =
        document.getElementById("nameInput");

    const name =
        input.value.trim();

    if(!name){

        showToast("আপনার নাম লিখুন");

        return;
    }

    myName = name;

    localStorage.setItem(
        "shakibys_name",
        name
    );

    startApp();
}


// START APP

function startApp(){

    document.getElementById("login")
        .style.display = "none";

    document.getElementById("app")
        .style.display = "block";

    connectSocket();
}


// SOCKET CONNECTION

function connectSocket(){

    socket = io();

    socket.on("connect", () => {

        myId = socket.id;

        socket.emit(
            "join",
            myName
        );

        showToast("ShakibYS সার্ভারে যুক্ত হয়েছে");

    });


    socket.on("joined", data => {

        myId = data.id;

    });


    socket.on("users", list => {

        users = list;

        renderUsers();

    });


    socket.on("public_message", message => {

        addMessage(
            message,
            false
        );

        notifyMessage(message);

    });


    socket.on("private_message", message => {

        const otherId =
            message.senderId === myId
            ? message.receiverId
            : message.senderId;

        if(!conversations[otherId]){
            conversations[otherId] = [];
        }

        conversations[otherId].push(message);

        if(
            selectedUser &&
            (
                selectedUser.id === message.senderId ||
                selectedUser.id === message.receiverId
            )
        ){

            renderConversation();

        }else if(message.senderId !== myId){

            showToast(
                "💬 " +
                message.sender +
                ": নতুন মেসেজ"
            );

        }

    });


    socket.on("system_message", data => {

        showToast(data.text);

    });


    socket.on("disconnect", () => {

        showToast(
            "সার্ভার থেকে সংযোগ বিচ্ছিন্ন"
        );

    });

}


// RENDER USERS

function renderUsers(){

    const list =
        document.getElementById("userList");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const filtered =
        users.filter(user =>
            user.name
            .toLowerCase()
            .includes(search)
        );

    list.innerHTML = "";

    if(!filtered.length){

        list.innerHTML = `
        <div class="empty">
            <div>
                <div class="empty-icon">👤</div>
                কোনো ইউজার নেই
            </div>
        </div>`;

        return;
    }

    filtered.forEach(user => {

        if(user.id === myId) return;

        const div =
            document.createElement("div");

        div.className =
            "user" +
            (
                selectedUser &&
                selectedUser.id === user.id
                ? " selected"
                : ""
            );

        div.onclick = () =>
            openChat(user);

        div.innerHTML = `

            <div class="avatar">
                ${getInitial(user.name)}
            </div>

            <div class="user-info">

                <div class="user-name">
                    ${escapeHtml(user.name)}
                </div>

                <div class="online">
                    ● Online
                </div>

            </div>

        `;

        list.appendChild(div);

    });

}


// OPEN CHAT

function openChat(user){

    selectedUser = user;

    document
        .getElementById("layout")
        .classList.add("chat-open");

    document
        .getElementById("chatTitle")
        .innerText = user.name;

    document
        .getElementById("chatAvatar")
        .innerText =
        getInitial(user.name);

    document
        .getElementById("chatStatus")
        .innerText = "● Online";

    renderUsers();

    renderConversation();

}


// RENDER PRIVATE CHAT

function renderConversation(){

    const box =
        document.getElementById("messages");

    if(!selectedUser){

        return;
    }

    const messages =
        conversations[selectedUser.id] || [];

    box.innerHTML = "";

    if(!messages.length){

        box.innerHTML = `
        <div class="empty">

            <div>

                <div class="empty-icon">
                    👋
                </div>

                <b>${escapeHtml(selectedUser.name)}</b>

                <p>
                    প্রথম মেসেজটি পাঠান
                </p>

            </div>

        </div>`;

        return;

    }

    messages.forEach(message => {

        const div =
            document.createElement("div");

        div.className =
            "message " +
            (
                message.senderId === myId
                ? "me"
                : "other"
            );

        div.innerHTML = `

            ${
                message.senderId !== myId
                ? `<div class="sender">
                    ${escapeHtml(message.sender)}
                   </div>`
                : ""
            }

            <div>
                ${escapeHtml(message.text)}
            </div>

            <div class="time">
                ${formatTime(message.time)}
            </div>

        `;

        box.appendChild(div);

    });

    box.scrollTop =
        box.scrollHeight;

}


// SEND MESSAGE

function sendMessage(){

    if(!socket || !socket.connected){

        showToast("সার্ভারের সাথে সংযোগ নেই");

        return;
    }

    if(!selectedUser){

        showToast("আগে একজন ইউজার নির্বাচন করুন");

        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if(!text) return;

    socket.emit(
        "private_message",
        {
            receiverId:
                selectedUser.id,

            text:text
        }
    );

    input.value = "";

}


// ADD MESSAGE

function addMessage(message){

    /*
      Public message এলে চাইলে
      পরে আলাদা Global Chat যোগ করা যাবে।
    */

}


// ENTER SEND

function handleEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

}


// SEARCH

function searchUsers(){

    renderUsers();

}


// CLOSE MOBILE CHAT

function closeChat(){

    document
        .getElementById("layout")
        .classList.remove("chat-open");

    selectedUser = null;

}


// DARK MODE

function toggleDark(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "shakibys_dark",
        document.body.classList.contains("dark")
    );

}


// LOGOUT

function logout(){

    if(socket){

        socket.disconnect();

    }

    localStorage.removeItem(
        "shakibys_name"
    );

    location.reload();

}


// TOAST

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.innerText = text;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },2500);

}


// NOTIFICATION

function notifyMessage(message){

    if(
        message.senderId !== myId &&
        document.hidden
    ){

        if(
            "Notification" in window &&
            Notification.permission === "granted"
        ){

            new Notification(
                "ShakibYS",
                {
                    body:
                    message.sender +
                    ": " +
                    message.text
                }
            );

        }

    }

}


// REQUEST NOTIFICATION

document.addEventListener(
    "click",
    () => {

        if(
            "Notification" in window &&
            Notification.permission === "default"
        ){

            Notification.requestPermission();

        }

    },
    {once:true}
);


// INITIAL LOAD

window.onload = () => {

    if(
        localStorage.getItem(
            "shakibys_dark"
        ) === "true"
    ){

        document.body.classList.add("dark");

    }

    const saved =
        localStorage.getItem(
            "shakibys_name"
        );

    if(saved){

        myName = saved;

        startApp();

    }

};


// HELPERS

function getInitial(name){

    return name
        ? name.trim().charAt(0).toUpperCase()
        : "?";

}


function formatTime(time){

    if(!time) return "";

    const date =
        new Date(time);

    return date.toLocaleTimeString(
        "bn-BD",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
