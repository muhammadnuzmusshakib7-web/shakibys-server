<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>ShakibYS</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --pink:#ff3f91;
  --pink2:#ff75b0;
  --bg:#fff5fa;
  --card:#ffffff;
  --text:#222;
  --muted:#888;
  --line:#f1dce7;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#ffd6e9,#fff5fa 55%);
}

.loginBox{
  width:100%;
  max-width:390px;
  background:#fff;
  padding:28px 22px;
  border-radius:28px;
  box-shadow:0 15px 45px #d94c8b25;
}

.logo{
  width:72px;
  height:72px;
  border-radius:23px;
  background:linear-gradient(135deg,var(--pink),#ff9ac5);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:auto;
  font-size:32px;
  font-weight:900;
  box-shadow:0 10px 25px #ff3f9140;
}

.loginBox h1{
  text-align:center;
  margin:15px 0 5px;
}

.loginBox p{
  text-align:center;
  color:var(--muted);
  margin-bottom:22px;
}

.input{
  width:100%;
  border:1px solid var(--line);
  background:#fffafd;
  border-radius:14px;
  padding:13px;
  outline:none;
  margin-bottom:10px;
}

.input:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px #ff3f9115;
}

.primary{
  width:100%;
  padding:13px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:white;
  font-weight:bold;
  box-shadow:0 8px 20px #ff3f9135;
}

.small{
  font-size:11px;
  color:#999;
  text-align:center;
  margin-top:12px;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:72px;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  background:#ffffffee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.brand{
  font-size:19px;
  font-weight:900;
  color:var(--pink);
}

.topRight{
  display:flex;
  align-items:center;
  gap:7px;
}

.iconBtn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#fff0f7;
  color:var(--pink);
  font-size:18px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--pink),#ff9dc8);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

main{
  max-width:700px;
  margin:auto;
  padding:10px;
}

/* PAGES */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* WELCOME */

.welcome{
  padding:18px;
  border-radius:20px;
  background:linear-gradient(
    135deg,
    #ff3f91,
    #ff78b2
  );
  color:#fff;
  margin-bottom:12px;
  box-shadow:0 10px 25px #ff3f9130;
}

.welcome h2{
  margin:0 0 5px;
}

.welcome p{
  margin:0;
  opacity:.9;
  font-size:12px;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px;
  margin-bottom:10px;
  box-shadow:0 4px 14px #cc5d8a0b;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:14px 2px 8px;
}

.sectionHead h3{
  margin:0;
  font-size:16px;
}

.createPost{
  display:flex;
  gap:8px;
  align-items:center;
}

.createPost input{
  flex:1;
  border:1px solid var(--line);
  border-radius:20px;
  padding:10px 13px;
  outline:none;
}

.createPost button{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--pink);
  color:white;
  font-size:18px;
}

/* POST */

.postHead{
  display:flex;
  align-items:center;
  gap:9px;
}

.postUser{
  flex:1;
}

.postUser strong{
  display:block;
}

.postUser span{
  color:#999;
  font-size:10px;
}

.more{
  background:none;
  font-size:20px;
  color:#999;
}

.postText{
  padding:10px 2px;
  line-height:1.55;
  white-space:normal;
}

.postStats{
  display:flex;
  gap:15px;
  color:#999;
  font-size:10px;
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
}

.postActions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  padding-top:8px;
}

.postActions button{
  padding:8px 3px;
  border-radius:10px;
  background:#fff2f8;
  color:#d92f76;
  font-size:11px;
}

/* SEARCH */

.searchBox{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.searchBox input{
  flex:1;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px;
  outline:none;
}

.searchBox button{
  width:45px;
  border-radius:15px;
  background:var(--pink);
  color:white;
  font-size:18px;
}

.userCard{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  margin-bottom:8px;
}

.userInfo{
  flex:1;
}

.userInfo strong{
  display:block;
}

.userInfo span{
  color:#999;
  font-size:10px;
}

.onlineDot{
  width:9px;
  height:9px;
  background:#25c875;
  border-radius:50%;
  display:inline-block;
  margin-right:3px;
}

.chatBtn{
  background:#fff0f7;
  color:var(--pink);
  padding:9px 11px;
  border-radius:12px;
}

/* CHAT */

.chatTop{
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 0 10px;
}

.back{
  background:#fff0f7;
  color:var(--pink);
  width:38px;
  height:38px;
  border-radius:50%;
}

.chatTitle{
  flex:1;
}

.chatTitle strong{
  display:block;
}

.chatTitle span{
  color:#999;
  font-size:10px;
}

.callButtons{
  display:flex;
  gap:5px;
}

.callButtons button{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#fff0f7;
  color:var(--pink);
}

.messages{
  height:calc(100vh - 210px);
  min-height:300px;
  overflow-y:auto;
  padding:10px 2px;
}

.bubble{
  max-width:78%;
  padding:9px 12px;
  margin:5px 0;
  border-radius:16px;
  line-height:1.45;
  word-wrap:break-word;
}

.mine{
  margin-left:auto;
  background:var(--pink);
  color:white;
  border-bottom-right-radius:4px;
}

.theirs{
  margin-right:auto;
  background:white;
  border:1px solid var(--line);
  border-bottom-left-radius:4px;
}

.chatInput{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,100%);
  background:#fff;
  padding:8px;
  display:flex;
  gap:6px;
  border-top:1px solid var(--line);
  z-index:15;
}

.chatInput input{
  flex:1;
  border:1px solid var(--line);
  border-radius:22px;
  padding:10px 13px;
  outline:none;
}

.chatInput button{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--pink);
  color:white;
}

/* AI */

.aiBox{
  display:flex;
  gap:7px;
}

.aiBox textarea{
  flex:1;
  min-height:90px;
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px;
  resize:none;
  outline:none;
}

.aiSend{
  align-self:flex-end;
  width:45px;
  height:45px;
  border-radius:50%;
  background:var(--pink);
  color:white;
}

.aiAnswer{
  margin-top:10px;
  padding:12px;
  background:#fff1f7;
  border-radius:15px;
  line-height:1.6;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:30;
}

.nav{
  background:none;
  color:#999;
  font-size:10px;
}

.nav.active{
  color:var(--pink);
  font-weight:bold;
}

.navIcon{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

/* CALL */

.callScreen{
  position:fixed;
  inset:0;
  z-index:100;
  background:#160b12;
  color:white;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.callScreen.active{
  display:flex;
}

.callAvatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--pink),#ff8abb);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
  margin-bottom:15px;
}

.callName{
  font-size:22px;
  font-weight:bold;
}

.callStatus{
  color:#ddd;
  margin:8px 0 25px;
}

.callControls{
  display:flex;
  gap:15px;
}

.callControls button{
  width:55px;
  height:55px;
  border-radius:50%;
  color:white;
  background:#ffffff22;
  font-size:20px;
}

.callControls .end{
  background:#ef315f;
}

/* VIDEO */

#remoteVideo,
#localVideo{
  position:absolute;
  object-fit:cover;
  background:#111;
}

#remoteVideo{
  inset:0;
  width:100%;
  height:100%;
}

#localVideo{
  width:120px;
  height:170px;
  right:15px;
  top:15px;
  border-radius:15px;
  border:2px solid white;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:20px;
  font-size:12px;
  display:none;
  z-index:200;
}

</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage">

  <div class="loginBox">

    <div class="logo">S</div>

    <h1>ShakibYS</h1>

    <p>Connect • Message • Call</p>

    <input
      id="loginName"
      class="input"
      placeholder="আপনার নাম"
      maxlength="40"
    >

    <input
      id="loginPhone"
      class="input"
      type="tel"
      placeholder="মোবাইল নম্বর"
      maxlength="20"
    >

    <button
      class="primary"
      onclick="login()"
    >
      🚀 Continue
    </button>

    <div class="small">
      নাম ও মোবাইল নম্বর দিয়ে প্রবেশ করুন
    </div>

  </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

  <header class="top">

    <div class="brand">
      ShakibYS
    </div>

    <div class="topRight">

      <button
        class="iconBtn"
        onclick="showPage('search')"
      >🔍</button>

      <div
        id="topAvatar"
        class="avatar"
      >S</div>

    </div>

  </header>


  <main>

    <!-- HOME -->

    <section
      id="home"
      class="page active"
    >

      <div class="welcome">

        <h2 id="welcome">
          স্বাগতম 👋
        </h2>

        <p>
          আপনার বন্ধুদের সাথে যুক্ত থাকুন
        </p>

      </div>

      <div class="card createPost">

        <input
          id="postInput"
          placeholder="আপনার মনের কথা লিখুন..."
        >

        <button onclick="createPost()">
          ＋
        </button>

      </div>

      <div class="sectionHead">

        <h3>
          🔥 News Feed
        </h3>

        <button
          class="chatBtn"
          onclick="loadPosts()"
        >
          ↻
        </button>

      </div>

      <div id="feed"></div>

    </section>


    <!-- SEARCH -->

    <section
      id="search"
      class="page"
    >

      <div class="sectionHead">

        <h3>
          🔎 Find Users
        </h3>

      </div>

      <div class="searchBox">

        <input
          id="searchInput"
          placeholder="নাম বা মোবাইল নম্বর..."
          onkeydown="if(event.key==='Enter')searchUsers()"
        >

        <button onclick="searchUsers()">
          🔍
        </button>

      </div>

      <div id="userResults">

        <div class="card">
          নাম অথবা মোবাইল নম্বর দিয়ে
          ইউজার খুঁজুন।
        </div>

      </div>

    </section>


    <!-- CHAT -->

    <section
      id="chat"
      class="page"
    >

      <div class="chatTop">

        <button
          class="back"
          onclick="showPage('search')"
        >
          ←
        </button>

        <div class="avatar" id="chatAvatar">
          U
        </div>

        <div class="chatTitle">

          <strong id="chatName">
            User
          </strong>

          <span id="chatStatus">
            Offline
          </span>

        </div>

        <div class="callButtons">

          <button
            onclick="startCall('voice')"
          >
            📞
          </button>

          <button
            onclick="startCall('video')"
          >
            🎥
          </button>

        </div>

      </div>

      <div
        id="messages"
        class="messages"
      ></div>

      <div class="chatInput">

        <input
          id="messageInput"
          placeholder="Message লিখুন..."
          oninput="typingStart()"
          onkeydown="
            if(event.key==='Enter')sendMessage()
          "
        >

        <button onclick="sendMessage()">
          ➤
        </button>

      </div>

    </section>


    <!-- AI -->

    <section
      id="ai"
      class="page"
    >

      <div class="sectionHead">
        <h3>🤖 ShakibYS AI</h3>
      </div>

      <div class="card">

        <div class="aiBox">

          <textarea
            id="aiInput"
            placeholder="AI-কে কিছু জিজ্ঞেস করুন..."
          ></textarea>

          <button
            class="aiSend"
            onclick="askAI()"
          >
            ➤
          </button>

        </div>

        <div
          id="aiAnswer"
          class="aiAnswer hidden"
        ></div>

      </div>

    </section>

  </main>


  <!-- NAV -->

  <nav class="bottom">

    <button
      class="nav active"
      data-page="home"
      onclick="showPage('home')"
    >
      <span class="navIcon">🏠</span>
      Home
    </button>

    <button
      class="nav"
      data-page="search"
      onclick="showPage('search')"
    >
      <span class="navIcon">🔍</span>
      Search
    </button>

    <button
      class="nav"
      data-page="chat"
      onclick="openLastChat()"
    >
      <span class="navIcon">💬</span>
      Messenger
    </button>

    <button
      class="nav"
      data-page="ai"
      onclick="showPage('ai')"
    >
      <span class="navIcon">🤖</span>
      AI
    </button>

  </nav>

</section>


<!-- CALL SCREEN -->

<div
  id="callScreen"
  class="callScreen"
>

  <video
    id="remoteVideo"
    autoplay
    playsinline
  ></video>

  <video
    id="localVideo"
    autoplay
    muted
    playsinline
  ></video>

  <div
    id="callAvatar"
    class="callAvatar"
  >
    U
  </div>

  <div
    id="callName"
    class="callName"
  >
    User
  </div>

  <div
    id="callStatus"
    class="callStatus"
  >
    Calling...
  </div>

  <div class="callControls">

    <button
      onclick="toggleMute()"
      id="muteBtn"
    >
      🎤
    </button>

    <button
      onclick="toggleCamera()"
      id="cameraBtn"
    >
      📹
    </button>

    <button
      class="end"
      onclick="endCall()"
    >
      ☎
    </button>

  </div>

</div>


<div id="toast"></div>


<script>

/* =========================
   GLOBAL
========================= */

const socket = io();

let currentUser =
  JSON.parse(
    localStorage.getItem("shakibys_user") || "null"
  );

let selectedUser = null;

let lastChatUser = null;

let peer = null;

let localStream = null;

let callType = "voice";

let pendingOffer = null;


/* =========================
   UTIL
========================= */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function toast(text){

  const el =
    document.getElementById("toast");

  el.textContent = text;

  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      () => el.style.display = "none",
      2200
    );

}


/* =========================
   LOGIN
========================= */

async function login(){

  const name =
    document
      .getElementById("loginName")
      .value.trim();

  const phone =
    document
      .getElementById("loginPhone")
      .value.trim();

  if(!name){

    toast("নাম লিখুন");

    return;
  }

  if(!phone || phone.length < 5){

    toast("সঠিক মোবাইল নম্বর দিন");

    return;
  }

  try{

    const response =
      await fetch("/api/auth",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          name,
          phone
        })

      });

    const data =
      await response.json();

    if(!data.success){

      toast(data.message || "Login failed");

      return;
    }

    currentUser = data.user;

    localStorage.setItem(
      "shakibys_user",
      JSON.stringify(currentUser)
    );

    enterApp();

  }catch(error){

    toast("Server connection নেই");

  }

}


function enterApp(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("welcome")
    .textContent =
      "স্বাগতম, " +
      currentUser.name +
      " 👋";

  document
    .getElementById("topAvatar")
    .textContent =
      currentUser.name
        .charAt(0)
        .toUpperCase();

  socket.emit(
    "user:online",
    {
      userId:currentUser.id,
      phone:currentUser.phone,
      name:currentUser.name
    }
  );

  loadPosts();

}


/* =========================
   AUTO LOGIN
========================= */

if(currentUser){

  enterApp();

}


/* =========================
   PAGE
========================= */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(
      el => el.classList.remove("active")
    );

  const target =
    document.getElementById(page);

  if(target){
    target.classList.add("active");
  }

  document
    .querySelectorAll(".nav")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );

    });

  if(page === "search"){
    setTimeout(
      () => document
        .getElementById("searchInput")
        ?.focus(),
      100
    );
  }

}


/* =========================
   NEWS FEED
========================= */

async function loadPosts(){

  try{

    const response =
      await fetch("/api/posts");

    const data =
      await response.json();

    if(data.success){

      renderPosts(data.posts);

    }

  }catch(e){}

}


function renderPosts(list){

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  if(!list || !list.length){

    feed.innerHTML = `
      <div class="card">
        এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি আপনি করুন। 💗
      </div>
    `;

    return;
  }

  list.forEach(
    post => addPost(post,false)
  );

}


function addPost(post,top=true){

  const feed =
    document.getElementById("feed");

  const article =
    document.createElement("article");

  article.className = "card";

  const first =
    esc(
      (post.author || "S")
        .charAt(0)
        .toUpperCase()
    );

  const time =
    new Date(
      post.createdAt || Date.now()
    ).toLocaleString(
      "bn-BD",
      {
        dateStyle:"short",
        timeStyle:"short"
      }
    );

  article.innerHTML = `

    <div class="postHead">

      <div class="avatar">
        ${first}
      </div>

      <div class="postUser">

        <strong>
          ${esc(post.author || "Shakib")}
        </strong>

        <span>
          ${time} • 🌐 Public
        </span>

      </div>

      <button class="more">
        ⋯
      </button>

    </div>

    <div class="postText">
      ${esc(post.content)
        .replace(/\n/g,"<br>")}
    </div>

    <div class="postStats">

      <span>
        ❤️ ${post.likes || 0} Likes
      </span>

      <span>
        💬 ${post.comments || 0} Comments
      </span>

    </div>

    <div class="postActions">

      <button onclick="likePost(this)">
        ❤️ Like

      </button>

      <button onclick="sharePost()">

      </button>

  `;

  if(top)
    feed.prepend(article);
  else
    feed.appendChild(article);

}


async function createPost(){

  const input =
    document.getElementById("postInput");

  const content =
    input.value.trim();

  if(!content){

    toast("Post লিখুন");

    return;
  }

  try{

    const response =
      await fetch("/api/posts",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          author:
            currentUser.name,

          authorId:
            currentUser.id,

          content

        })

      });

    const data =
      await response.json();

    if(data.success){

      input.value = "";

      toast("Post published ✅");

    }else{

      toast(data.message || "Post failed");

    }

  }catch(e){

    toast("Server connection নেই");

  }

}


function likePost(button){

  button.textContent = "💗 Liked";

  button.disabled = true;

}


function sharePost(){

  if(
    navigator.share
  ){

    navigator.share({
      title:"ShakibYS",

}

/* =========================
   USER SEARCH
========================= */

async function searchUsers(){

  const q =
    document
      .getElementById("searchInput")
      .value.trim();

  const box =
    document.getElementById("userResults");

  if(!q){

    box.innerHTML = `
      <div class="card">
        নাম অথবা মোবাইল নম্বর লিখুন।
      </div>
    `;

    return;
  }

  try{

    const response =
      await fetch(
        "/api/users?q=" +
        encodeURIComponent(q) +
        "&current=" +
        encodeURIComponent(
          currentUser.phone
        )
      );

    const data =
      await response.json();

    box.innerHTML = "";

    if(!data.users.length){

      box.innerHTML = `
        <div class="card">
          😔 কোনো ইউজার পাওয়া যায়নি।
        </div>
      `;

      return;
    }

    data.users.forEach(
      user => {

        const div =
          document.createElement("div");

        div.className = "userCard";

        const first =
          esc(
            user.name
              .charAt(0)
              .toUpperCase()
          );

        div.innerHTML = `

          <div class="avatar">
            ${first}
          </div>

          <div class="userInfo">

            <strong>
              ${esc(user.name)}
            </strong>

            <span>
              ${user.online
                ? '<i class="onlineDot"></i>Online'
                : '⚪ Offline'}
              • ${esc(user.phone)}
            </span>

          </div>

          <button
            class="chatBtn"
            onclick='openChat(${JSON.stringify(user)})'
          >
            💬
          </button>

        `;

        box.appendChild(div);

      }
    );

  }catch(e){

    toast("User search failed");

  }

}


/* =========================
   CHAT
========================= */

function openChat(user){

  selectedUser = user;

  lastChatUser = user;

  document
    .getElementById("chatName")
    .textContent =
      user.name;

  document
    .getElementById("chatAvatar")
    .textContent =
      user.name
        .charAt(0)
        .toUpperCase();

  updateChatStatus(user);

  showPage("chat");

  document
    .getElementById("messages")
    .innerHTML = "";

  socket.emit(
    "message:history",
    {
      userA:currentUser.id,
      userB:user.id
    }
  );

}


function openLastChat(){

  if(lastChatUser){

    openChat(lastChatUser);

  }else{

    showPage("search");

    toast("আগে একজন User খুঁজুন");

  }

}


socket.on(
  "message:history",
  list => {

    if(!selectedUser) return;

    const box =
      document.getElementById("messages");

    box.innerHTML = "";

    list.forEach(
      renderMessage
    );

    scrollMessages();

  }
);


function renderMessage(message){

  const box =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  div.className =
    "bubble " +
    (
      message.senderId === currentUser.id
        ? "mine"
        : "theirs"
    );

  div.innerHTML =
    esc(message.text)
      .replace(/\n/g,"<br>");

  box.appendChild(div);

}


function sendMessage(){

  if(!selectedUser){

    toast("আগে একজন User নির্বাচন করুন");

    return;
  }

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text) return;

  socket.emit(
    "message:send",
    {
      senderId:
        currentUser.id,

      senderName:
        currentUser.name,

      receiverId:
        selectedUser.id,

      text,

      type:"text"
    }
  );

  input.value = "";

}


socket.on(
  "message:new",
  message => {

    if(!selectedUser) return;

    const valid =
      (
        message.senderId === currentUser.id &&
        message.receiverId === selectedUser.id
      ) ||
      (
        message.senderId === selectedUser.id &&
        message.receiverId === currentUser.id
      );

    if(!valid) return;

    renderMessage(message);

    scrollMessages();

  }
);


function scrollMessages(){

  const box =
    document.getElementById("messages");

  box.scrollTop =
    box.scrollHeight;

}


/* =========================
   ONLINE STATUS
========================= */

socket.on(
  "user:status",
  data => {

    if(
      selectedUser &&
      (
        data.userId === selectedUser.id ||
        data.userId === selectedUser.phone
      )
    ){

      selectedUser.online =
        data.online;

      updateChatStatus(
        selectedUser
      );

    }

  }
);


function updateChatStatus(user){

  document
    .getElementById("chatStatus")
    .textContent =
      user.online
        ? "🟢 Online"
        : "⚪ Offline";

}

   TYPING
========================= */

let typingTimer;

  if(!selectedUser) return;

  socket.emit(
    "typing:start",
    {
      receiverId:

  data => {

    if(selectedUser){

      document
        .getElementById("chatStatus")

          data.senderName +

    }

);

/* =========================
   WEBRTC CALL
========================= */

function rtcConfig(){

  return {

    iceServers:[

      {
        urls:
          "stun:stun.l.google.com:19302"
      },

      {
        urls:
          "stun:stun1.l.google.com:19302"
      }

    ]

  };

}


async function createPeer(){

  peer =
    new RTCPeerConnection(
      rtcConfig()
    );

  peer.onicecandidate =
    event => {

      if(
        event.candidate &&
        selectedUser
      ){

        socket.emit(
          "call:ice",
          {
            targetUserId:
              selectedUser.id,

            candidate:
              event.candidate
          }
        );

      }

    };


  peer.ontrack =
    event => {

      const video =
        document.getElementById(
          "remoteVideo"
        );

      video.srcObject =
        event.streams[0];

    };


  peer.onconnectionstatechange =
    () => {

      if(
        peer.connectionState ===
        "connected"
      ){

        document
          .getElementById("callStatus")
          .textContent =
            "Connected";

      }

      if(
        ["failed","disconnected","closed"]
        .includes(peer.connectionState)
      ){

        endCall(false);

      }

    };

}


async function getMedia(type){

  return navigator.mediaDevices.getUserMedia({

    audio:true,

    video:
      type === "video"

  });

}


function showCallScreen(name){

  const screen =
    document.getElementById(
      "callScreen"
    );

  screen.classList.add("active");

  document
    .getElementById("callAvatar")
    .textContent =
      name
        .charAt(0)
        .toUpperCase();

  document
    .getElementById("callName")
    .textContent =
      name;

}


async function startCall(type){

  if(!selectedUser){

    toast("আগে একজন User নির্বাচন করুন");

    return;
  }

  if(!window.isSecureContext){

    toast("Call-এর জন্য HTTPS দরকার");

    return;
  }

  callType = type;

  try{

    localStream =
      await getMedia(type);

    showCallScreen(
      selectedUser.name
    );

    document
      .getElementById("callStatus")
      .textContent =
        "Calling...";

    const localVideo =
      document.getElementById(
        "localVideo"
      );

    localVideo.srcObject =
      localStream;

    localVideo.style.display =
      type === "video"
        ? "block"
        : "none";

    document
      .getElementById("remoteVideo")
      .style.display =
        type === "video"
          ? "block"
          : "none";

    await createPeer();

    localStream
      .getTracks()
      .forEach(
        track =>
          peer.addTrack(
            track,
            localStream
          )
      );

    const offer =
      await peer.createOffer();

    await peer.setLocalDescription(
      offer
    );

    socket.emit(
      "call:offer",
      {
        receiverId:
          selectedUser.id,

        callerId:
          currentUser.id,

        callerName:
          currentUser.name,

        callType:type,

        offer
      }
    );

  }catch(error){

    console.error(error);

    toast(
      "Camera/Microphone permission দিন"
    );

    endCall(false);

  }

}


/* INCOMING CALL */

socket.on(
  "call:offer",
  async data => {

    pendingOffer = data;

    const accept =
      confirm(
        data.callerName +
        " আপনাকে " +
        (
          data.callType === "video"
            ? "Video"
            : "Audio"
        ) +
        " Call দিচ্ছে।\n\nAccept?"
      );

    if(!accept){

      socket.emit(
        "call:reject",
        {
          callerId:
            data.callerId,

          receiverId:
            currentUser.id
        }
      );

      pendingOffer = null;

      return;
    }

    callType =
      data.callType;

    selectedUser = {
      id:data.callerId,
      name:data.callerName
    };

    try{

      localStream =
        await getMedia(
          callType
        );

      showCallScreen(
        data.callerName
      );

      const localVideo =
        document.getElementById(
          "localVideo"
        );

      localVideo.srcObject =
        localStream;

      localVideo.style.display =
        callType === "video"
          ? "block"
          : "none";

      document
        .getElementById("remoteVideo")
        .style.display =
          callType === "video"
            ? "block"
            : "none";

      await createPeer();

      localStream
        .getTracks()
        .forEach(
          track =>
            peer.addTrack(
              track,
              localStream
            )
        );

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      const answer =
        await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );

      socket.emit(
        "call:answer",
        {
          callerId:
            data.callerId,

          receiverId:
            currentUser.id,

          answer
        }
      );

    }catch(error){

      console.error(error);

      toast(
        "Call permission দেওয়া হয়নি"
      );

      endCall(false);

    }

  }
);


/* ANSWER */

socket.on(
  "call:answer",
  async data => {

    if(
      !peer ||
      !data.answer
    ) return;

    await peer.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

    document
      .getElementById("callStatus")
      .textContent =
        "Connected";

  }
);


/* ICE */

socket.on(
  "call:ice",
  async data => {

    try{

      if(
        peer &&
        data.candidate
      ){

        await peer.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }

    }catch(e){}

  }
);


/* REJECT */

socket.on(
  "call:rejected",
  () => {

    toast("Call rejected");

    endCall(false);

  }
);


/* END */

socket.on(
  "call:ended",
  () => {

    toast("Call ended");

    endCall(false);

  }
);


function toggleMute(){

  if(!localStream) return;

  const track =
    localStream.getAudioTracks()[0];

  if(!track) return;

  track.enabled =
    !track.enabled;

  document
    .getElementById("muteBtn")
    .textContent =
      track.enabled
        ? "🎤"
        : "🔇";

}


function toggleCamera(){

  if(!localStream) return;

  const track =
    localStream.getVideoTracks()[0];

  if(!track) return;

  track.enabled =
    !track.enabled;

  document
    .getElementById("cameraBtn")
    .textContent =
      track.enabled
        ? "📹"
        : "🚫";

}


function endCall(send=true){

  if(
    send &&
    selectedUser
  ){

    socket.emit(
      "call:end",
      {
        targetUserId:
          selectedUser.id,

        from:
          currentUser.id
      }
    );

  }

  if(peer){

    peer.close();

    peer = null;

  }

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream = null;

  }

  document
    .getElementById("localVideo")
    .srcObject = null;

  document
    .getElementById("remoteVideo")
    .srcObject = null;

  document
    .getElementById("callScreen")
    .classList.remove("active");

}


/* =========================
   SOCKET CONNECT
========================= */

socket.on(
  "connect",
  () => {

    if(currentUser){

      socket.emit(
        "user:online",
        {
          userId:
            currentUser.id,

          phone:
            currentUser.phone,

          name:
            currentUser.name
        }
      );

    }

  }
);

</script>
