<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <title>ShakibYS</title>

  <link rel="stylesheet" href="style.css">

  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

<div id="authPage" class="authPage">

  <div class="authCard">

    <div class="brand">ShakibYS</div>

    <h2 id="authTitle">Login</h2>

    <div id="registerArea" class="hidden">

      <input
        id="registerName"
        placeholder="আপনার নাম"
      >

    </div>

    <input
      id="phone"
      placeholder="মোবাইল নাম্বার"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      class="pinkButton"
      onclick="login()"
    >
      Login
    </button>

    <button
      class="outlineButton"
      onclick="toggleRegister()"
    >
      Create New Account
    </button>

    <button
      id="registerButton"
      class="pinkButton hidden"
      onclick="register()"
    >
      Register
    </button>

  </div>

</div>


<div id="app" class="hidden">

  <header class="topbar">

    <div class="logo">
      ShakibYS
    </div>

    <div class="topActions">

      <button onclick="showSearch()">⌕</button>

      <button onclick="showNotifications()">♡</button>

      <button onclick="showProfile(currentUser.id)">
        ●
      </button>

    </div>

  </header>


  <main id="page"></main>


  <nav class="bottomNav">

    <button onclick="home()">
      🏠
      <small>Home</small>
    </button>

    <button onclick="showSearch()">
      🔎
      <small>Search</small>
    </button>

    <button onclick="openCreate()">
      ＋
      <small>Create</small>
    </button>

    <button onclick="showNotifications()">
      ♡
      <small>Alerts</small>
    </button>

    <button onclick="showProfile(currentUser.id)">
      ●
      <small>Profile</small>
    </button>

  </nav>

</div>


<div id="modal" class="modal hidden">

  <div id="modalContent" class="modalContent"></div>

</div>


<div id="chat" class="chat hidden">

  <div class="chatTop">

    <button onclick="closeChat()">‹</button>

    <b id="chatName"></b>

    <button onclick="callUser('voice')">
      ☎
    </button>

    <button onclick="callUser('video')">
      🎥
    </button>

  </div>

  <div id="messages" class="messages"></div>

  <div class="messageBox">

    <input
      id="messageInput"
      placeholder="Message..."
      onkeydown="messageKey(event)"
    >

    <button onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>


<div id="toast" class="toast"></div>


<script src="app.js"></script>

</body>
</html>
